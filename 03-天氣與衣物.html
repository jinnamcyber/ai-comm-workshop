<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天氣與衣物</title>
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#1F2A44; --ink-2:#5B6478; --line:#E8DFCF;
  --primary:#2F6FED; --primary-soft:#E3ECFF;
  --good:#1E9E6A; --good-soft:#DDF5EA;
  --hint:#E9A23B; --hint-soft:#FFF1D6;
  --accent:#E8618C; --accent-soft:#FDE4EC;
  --radius:22px; --shadow:0 6px 0 rgba(31,42,68,.08), 0 14px 30px rgba(31,42,68,.08);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --childbg:#FFF2C9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:clamp(24px,1.25vw,30px);line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px 16px 4px;overflow:hidden}

/* top bar */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{display:flex;align-items:center;gap:14px;min-width:0}
.chip{background:var(--primary);color:#fff;border-radius:999px;padding:6px 22px;font-weight:700;font-size:24px;white-space:nowrap}
h1{margin:0;font-size:clamp(28px,2.1vw,42px);white-space:nowrap}
.top .right{display:flex;gap:12px}
.btn{min-height:64px;border:0;border-radius:18px;font-size:inherit;font-weight:700;color:#fff;background:var(--primary);
  box-shadow:0 6px 0 rgba(31,42,68,.28);padding:0 24px;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation;white-space:nowrap}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(31,42,68,.28)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.good{background:var(--good)}
.btn.accent{background:var(--accent)}
.btn:focus-visible,.wxb:focus-visible,.item:focus-visible{outline:4px solid var(--hint);outline-offset:2px}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr .85fr 1.25fr;gap:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;min-height:0;min-width:0}

/* scene */
.scene-wrap{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#BFE3FF}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.wxinfo{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.pill{background:rgba(255,255,255,.9);border-radius:16px;padding:2px 16px;font-weight:800;font-size:clamp(28px,2vw,40px);box-shadow:0 4px 0 rgba(31,42,68,.12)}
.pill.small{font-size:clamp(24px,1.5vw,32px);font-weight:700;color:var(--ink-2)}
.wx-buttons{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.wxb{min-height:80px;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;font-size:24px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 0;cursor:pointer;box-shadow:0 5px 0 var(--line);
  transition:transform .08s,box-shadow .08s,background .2s,border-color .2s;touch-action:manipulation;line-height:1.15}
.wxb .em{font-size:30px;line-height:1.1}
.wxb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.wxb.on{background:var(--primary-soft);border-color:var(--primary);box-shadow:0 5px 0 var(--primary)}
.wxb.rand{background:var(--accent-soft);border-color:#F4B3C8;box-shadow:0 5px 0 #F4B3C8}

/* child */
.child-card{padding:8px}
.child-wrap{position:relative;flex:1;min-height:0;border-radius:16px;background:var(--childbg);transition:background-color .9s ease,outline-color .2s;overflow:hidden;outline:4px solid transparent;outline-offset:-4px}
.child-wrap.drop{outline:4px dashed var(--primary);background-image:linear-gradient(rgba(47,111,237,.10),rgba(47,111,237,.10))}
#childSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.anim{transform-box:fill-box;transform-origin:center}
.layer{opacity:0;transform:translateY(-16px) scale(.94);transition:opacity .28s ease,transform .32s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.layer.on{opacity:1;transform:none}

/* wardrobe */
.ward-card h2{margin:2px 6px 8px;font-size:clamp(26px,1.7vw,34px);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ward-card h2 small{font-size:24px;color:var(--ink-2);font-weight:500}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px}
.item{position:relative;min-height:64px;min-width:0;border:3px solid var(--line);background:#FFFDF8;border-radius:16px;padding:4px 4px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:24px;font-weight:700;color:var(--ink);cursor:grab;
  box-shadow:0 5px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s,background .2s,border-color .2s;line-height:1.15}
.item svg{flex:1;min-height:0;width:100%;pointer-events:none}
.item:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.item.worn{background:var(--good-soft);border-color:var(--good);box-shadow:0 5px 0 var(--good)}
.item.worn::after{content:"✓";position:absolute;right:6px;top:2px;width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;line-height:1}
.item.clear{background:var(--accent-soft);border-color:#F4B3C8;box-shadow:0 5px 0 #F4B3C8;justify-content:center;gap:2px;cursor:pointer}
.item.clear .em{font-size:40px;line-height:1}
.ghost-drag{position:fixed;z-index:50;width:110px;height:110px;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg);filter:drop-shadow(0 10px 10px rgba(31,42,68,.3))}
.ghost-drag svg{width:100%;height:100%}

/* strip */
.strip{flex:none;display:flex;gap:12px;align-items:stretch;min-height:112px}
.strip .btn{min-width:150px;font-size:clamp(26px,1.7vw,34px)}
.msg{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:#fff;border:4px solid var(--line);border-radius:var(--radius);padding:8px 18px;box-shadow:var(--shadow);transition:background .3s,border-color .3s;max-height:154px;overflow:auto}
.msg.good{background:var(--good-soft);border-color:var(--good);animation:okpop .5s ease}
.msg.hint{background:var(--hint-soft);border-color:var(--hint)}
.msg.say{background:var(--primary-soft);border-color:var(--primary)}
#msgMain{flex:1;min-width:0;line-height:1.4}
.hd{font-weight:800;margin-right:12px}
.tip{display:inline-block;margin:2px 14px 2px 0}
.tip::before{content:"• ";color:var(--ink-2)}
.sent{font-size:clamp(26px,1.7vw,34px);font-weight:700;line-height:1.55}
.chunk{border-radius:10px;padding:0 2px;transition:background .2s}
.chunk.now{background:var(--hint);color:#fff}
.chunk.now .slot{background:#fff;color:var(--ink)}
.slot{background:#fff;border-bottom:5px solid var(--primary);border-radius:8px;padding:0 6px;margin:0 1px;color:var(--primary)}
.sub{display:block;font-size:24px;font-weight:500;color:var(--ink-2)}
.tools{display:flex;gap:8px;flex:none}
.tools[hidden]{display:none}
.tools .btn{min-width:64px;padding:0 14px}
.btn.tog[aria-pressed="true"]{background:var(--hint);color:#fff}
footer{flex:none;text-align:right;font-size:14px;color:var(--ink-2);padding:0 4px 2px}

/* weather animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(820px)}}
@keyframes rain{from{transform:translate(0,-40px)}to{transform:translate(-70px,580px)}}
@keyframes snowfall{0%{transform:translate(0,-20px)}30%{transform:translate(-26px,170px)}65%{transform:translate(22px,360px)}100%{transform:translate(-8px,560px)}}
@keyframes wl{0%{transform:translateX(-220px);opacity:0}12%{opacity:.9}85%{opacity:.9}100%{transform:translateX(780px);opacity:0}}
@keyframes leaf{0%{transform:translate(-60px,0) rotate(0)}25%{transform:translate(160px,-50px) rotate(200deg)}50%{transform:translate(340px,25px) rotate(380deg)}75%{transform:translate(520px,-40px) rotate(560deg)}100%{transform:translate(740px,12px) rotate(760deg)}}
@keyframes heat{0%{transform:translateY(0);opacity:0}25%{opacity:.85}100%{transform:translateY(-70px);opacity:0}}
@keyframes ripple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@keyframes drip{0%{transform:translateY(-4px) scale(.7);opacity:0}20%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(30px);opacity:0}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(-14px,-60px) scale(1.5);opacity:0}}
@keyframes kite{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px)}60%{transform:translateY(0)}78%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes okpop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.wxl{opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s;pointer-events:none}
.wxl.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.spin{animation:spin 26s linear infinite}
.pulse{animation:pulse 3.4s ease-in-out infinite}
.cl{animation:drift 80s linear infinite}
.rd{animation:rain .8s linear infinite}
.sf{animation:snowfall 8s linear infinite}
.wl{animation:wl 5s linear infinite}
.lf{animation:leaf 7s linear infinite}
.hw{animation:heat 3.2s ease-out infinite}
.rp{animation:ripple 2.2s ease-out infinite}
.dr{animation:drip 1.8s ease-in infinite}
.sm{animation:smoke 3.6s ease-out infinite}
.kt{animation:kite 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:300px 400px}
.blink{animation:blink 4.2s infinite}
.hop{animation:hop .8s ease}
.shiver{animation:shake .16s linear infinite}
.tw{animation:twinkle 1.6s ease-in-out infinite}
.fxg{opacity:0;transition:opacity .25s;pointer-events:none}
.fxg.on{opacity:1}

/* narrow screens */
@media (max-width:980px){
  #app{height:auto;min-height:100vh;overflow:visible}
  .stage{grid-template-columns:1fr}
  .scene-wrap{min-height:320px;flex:none;height:56vw}
  .child-wrap{min-height:420px}
  .grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(110px,auto)}
  .strip{flex-wrap:wrap}
  .msg{flex-basis:100%;order:3}
  .item{touch-action:pan-y}
  h1{white-space:normal}
  .top{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){.cl,.spin,.pulse{animation-duration:200s}}
</style>
<script src="audio/no-tts.js"></script>

var canTTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);

 return voices.filter(function(v){return n(v)==='zh-hk';})[0]||voices.filter(function(v){return n(v).indexOf('yue')===0;})[0]||voices.filter(function(v){return n(v).indexOf('zh')===0;})[0]||null;}
function ttsFallback(text,opt){opt=opt||{};var done=false,tm=null;function fin(){if(done)return;done=true;clearTimeout(tm);if(opt.onend)opt.onend();}
 tm=setTimeout(fin,canTTS?Math.max(1500,text.length*600)+4000:Math.max(900,text.length*350));
 if(canTTS){try{var u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';var v=pickVoice();if(v)u.voice=v;u.rate=(opt.rate&&opt.rate<1)?.6:.85;u.onend=fin;u.onerror=fin;window.speechSynthesis.speak(u);}catch(e){fin();}}}
var VOICE=(function(){var cur=null;

 function lookup(t){return (window.VOICE_LINES||{})[norm(t)];}
 function stop(){if(cur){cur.onended=null;cur.onerror=null;try{cur.pause();}catch(e){}cur=null;}try{if(canTTS)window.speechSynthesis.cancel();}catch(e){}}
 function speak(text,opt){opt=opt||{};stop();var src=lookup(text);
  if(src){try{var a=new Audio(src);cur=a;a.playbackRate=opt.rate||1;a.preservesPitch=true;
   a.onended=function(){if(cur===a)cur=null;if(opt.onend)opt.onend();};
   a.onerror=function(){if(cur===a)cur=null;ttsFallback(text,opt);};
   var pr=a.play();if(pr&&pr.catch)pr.catch(function(){if(cur===a)cur=null;ttsFallback(text,opt);});return;}catch(e){cur=null;}}
  ttsFallback(text,opt);}
 return {speak:speak,stop:stop,has:function(t){return !!lookup(t);}};})();
var token=0;
function cancelSpeech(){token++;VOICE.stop();}
/* segs: [{c:chunkIndex,t:text}] 固定片段逐段播放，逐段高亮 */
function sayChunks(segs,onChunk,onEnd){var my=++token;VOICE.stop();var i=0,last=-1,rate=slow?.75:1;
 function next(){if(my!==token)return;if(i>=segs.length){if(onEnd)onEnd();return;}var sg=segs[i++];if(sg.c!==last){last=sg.c;if(onChunk)onChunk(sg.c);}
  VOICE.speak(sg.t,{rate:rate,onend:function(){if(my!==token)return;setTimeout(next,30);}});}
 setTimeout(next,60);}
var FALLBACK='我想著得舒服啲。';
function adjSeg(wd){return '今日天氣'+wd.adj+'呀，';}
function joinList(a){if(a.length<=1)return a.map(function(v){return {s:v};});var o=[];a.forEach(function(x,i){if(i>0)o.push({t:i===a.length-1?'同':'、'});o.push({s:x});});return o;}
function buildSentence(){
 var w=worn,wd=W[curW];
 var clothes=['outer','top','bottom','shoes'].map(function(s){return w[s]?BYID[w[s]].name:null;}).filter(Boolean);
 var acc=[];if(w.head)acc.push('戴'+BYID[w.head].name);if(w.neck)acc.push('圍'+BYID[w.neck].name);if(w.hand)acc.push('拎'+BYID[w.hand].name);
 if(!clothes.length&&!acc.length)return null;
 function names(list,c){var o=[];list.forEach(function(x,i){if(i>0)o.push({c:c,t:'同'});o.push({c:c,t:x});});return o;}
 var chunks=[];
 chunks.push({parts:[{t:'今日天氣'},{s:wd.adj},{t:'呀，'}],seg:[{c:0,t:adjSeg(wd)}]});
 if(clothes.length){var c1=chunks.length;chunks.push({parts:[{t:'我會著'}].concat(joinList(clothes),[{t:'，'}]),seg:[{c:c1,t:'我會著'}].concat(names(clothes,c1))});}
 if(acc.length){var c2=chunks.length;var lead=clothes.length?'仲會':'我會';chunks.push({parts:[{t:lead}].concat(joinList(acc),[{t:'，'}]),seg:[{c:c2,t:lead}].concat(names(acc,c2))});}
 var rs=[];(REASON[curW]||[]).forEach(function(r){var slot=BYID[r[0]].slot;if(w[slot]===r[0]&&rs.length<2)rs.push(r[1]);});
 var c3=chunks.length,seg=[{c:c3,t:'因為'}],disp;
 if(rs.length){rs.forEach(function(r,i){seg.push({c:c3,t:r+(i<rs.length-1?'，':'。')});});disp=rs.join('，');}
 else{seg.push({c:c3,t:FALLBACK});disp=FALLBACK.replace('。','');}
 chunks.push({parts:[{t:'因為'},{s:disp},{t:'。'}],seg:seg});
 return chunks;}
function allSegments(){var o={};function add(t){o[t]=1;}
 Object.keys(W).forEach(function(k){add(adjSeg(W[k]));});
 ['我會著','仲會','我會','同','因為',FALLBACK].forEach(add);
 ITEMS.forEach(function(it){if(it.slot==='hand')add('拎'+it.name);else if(it.slot==='head')add('戴'+it.name);else if(it.slot==='neck')add('圍'+it.name);else add(it.name);});
 Object.keys(REASON).forEach(function(k){REASON[k].forEach(function(r){add(r[1]+'，');add(r[1]+'。');});});
 return Object.keys(o);}
var lastChunks=null;
function renderSentence(chunks){return '<div class="sent">'+chunks.map(function(c,i){return '<span class="chunk" data-i="'+i+'">'+c.parts.map(function(p){return p.s!==undefined?'<span class="slot">'+p.s+'</span>':p.t;}).join('')+'</span>';}).join('')+'</div>';}
function setNow(i){$$('#msgMain .chunk').forEach(function(c){c.classList.toggle('now',String(i)===c.getAttribute('data-i'));});}
function doSpeak(fresh){
 ctx();var chunks=fresh?buildSentence():lastChunks;
 if(!chunks){stopTalk();cancelSpeech();showMsg('<span class="hd">👕 先揀衫吖</span>你先揀啲衫畀小朋友著，再撳「講一講」吖。','hint',false);msgState='say';return;}
 lastChunks=chunks;msgState='say';curMood='happy';
 var segs=[];chunks.forEach(function(c){c.seg.forEach(function(x){segs.push(x);});});
 var hasVoice=VOICE.has(segs[0].t)||canTTS;
 showMsg(renderSentence(chunks)+'<span class="sub">'+(hasVoice?'聽聽看，然後跟住讀':'呢部機冇語音，請老師讀出嚟，學生跟讀')+'</span>','say',true);
 startTalk();
 sayChunks(segs,function(i){setNow(i);},function(){stopTalk();setNow(-1);curMood='happy';setMood('happy');var sub=$('#msgMain .sub');if(sub)sub.textContent='🎤 輪到你喇！跟住讀一次';});
}
$('#btnSpeak').addEventListener('click',function(){doSpeak(true);});
$('#btnReplay').addEventListener('click',function(){doSpeak(false);});
$('#btnSlow').addEventListener('click',function(){slow=!slow;this.setAttribute('aria-pressed',slow?'true':'false');if(lastChunks&&msgState==='say')doSpeak(false);});

/* ---------- top bar ---------- */
var fsBtn=$('#btnFs');
function fsLabel(){if(fsBtn)fsBtn.textContent=document.fullscreenElement?'⛶ 離開全螢幕':'⛶ 全螢幕';}
if(fsBtn)fsBtn.addEventListener('click',function(){try{if(document.fullscreenElement){document.exitFullscreen();}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}}catch(e){}});
document.addEventListener('fullscreenchange',fsLabel);
$('#btnReset').addEventListener('click',function(){stopTalk();cancelSpeech();worn={};lastChunks=null;slow=false;var sl=$('#btnSlow');if(sl)sl.setAttribute('aria-pressed','false');render();setWeather('sunny');defaultMsg();});

/* init */
render();setWeather('sunny');defaultMsg();
window.__wx={allSegments:allSegments,wear:wear,setWeather:setWeather,check:doCheck,speak:function(){doSpeak(true);},worn:function(){return worn;}};
})();
</script>
