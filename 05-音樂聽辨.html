<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音樂聽辨</title>
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#1F2A44; --ink-2:#5B6478; --line:#E8DFCF;
  --primary:#2F6FED; --primary-soft:#E3ECFF;
  --good:#1E9E6A; --good-soft:#DDF5EA;
  --hint:#E9A23B; --hint-soft:#FFF1D6;
  --accent:#E8618C; --accent-soft:#FDE4EC;
  --radius:22px; --shadow:0 6px 0 rgba(31,42,68,.08), 0 14px 30px rgba(31,42,68,.08);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --u:min(1vw,1.7778vh);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{font-size:max(24px,calc(var(--u)*1.45));overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.stage{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(var(--u)*.9) calc(var(--u)*1.6) calc(var(--u)*1.6);
  background:radial-gradient(circle at 8% 12%,#FFEFCF 0,transparent 30%),radial-gradient(circle at 94% 88%,#FFE3EC 0,transparent 28%),var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:max(64px,calc(var(--u)*4.6));flex:none}
.top .l{display:flex;align-items:center;gap:14px;min-width:0}
.chip{background:var(--primary);color:#fff;border-radius:999px;padding:.15em .8em;font-weight:700;white-space:nowrap}
h1{margin:0;font-size:1.25em;white-space:nowrap}
.top .r{display:flex;align-items:center;gap:14px}
.badge{background:#FFE9A8;border:3px solid #F5B82E;border-radius:999px;padding:.1em .8em;font-weight:800;font-size:1.15em;min-height:64px;display:flex;align-items:center;white-space:nowrap}
.badge[hidden]{display:none}
.badge.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1)}}
.btn{border:0;border-radius:16px;min-height:64px;padding:.35em 1.1em;font-weight:700;background:var(--primary);color:#fff;
  box-shadow:0 6px 0 rgba(31,42,68,.22);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,42,68,.22)}
.btn.primary{background:var(--primary)}
.btn.good{background:var(--good)}
.btn.hint{background:var(--hint)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 rgba(31,42,68,.1)}
.btn.big{font-size:1.3em;min-height:calc(var(--u)*5.6);padding:.2em 1.6em}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.foot{position:fixed;right:14px;bottom:6px;font-size:14px;color:var(--ink-2);opacity:.85;pointer-events:none}

/* setup */
.setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);text-align:center}
.setup h2{margin:0;font-size:1.7em}
.setup .sub{color:var(--ink-2);margin-top:-.4em}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.2);max-width:calc(var(--u)*92)}
.catbtn{width:calc(var(--u)*29);min-height:calc(var(--u)*9);background:#fff;border:4px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.5);padding:.3em .6em;font-weight:700}
.catbtn .mini svg{width:calc(var(--u)*5.6);height:calc(var(--u)*4.6);display:block}
.catbtn .mini{display:flex}
.catbtn.sel{border-color:var(--primary);background:var(--primary-soft)}
.catbtn .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.catbtn .tx small{font-weight:400;color:var(--ink-2);font-size:.75em}
.modes{display:flex;gap:calc(var(--u)*1.2);flex-wrap:wrap;justify-content:center}
.modebtn{min-height:64px;padding:.3em 1.2em;background:#fff;border:4px solid var(--line);border-radius:16px;font-weight:700}
.modebtn.sel{border-color:var(--accent);background:var(--accent-soft)}

/* quiz */
.quiz{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
.prog{display:flex;align-items:center;gap:calc(var(--u)*1.2);flex:none;color:var(--ink-2);font-weight:700}
.prog .cat{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:0 .8em}
.dots{display:flex;gap:calc(var(--u)*.5);margin-left:auto}
.dots i{width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--hint)} .dots i.seen{background:var(--primary)}
.dots i.cur{background:#fff;border:4px solid var(--primary)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:3px solid var(--line)}
.prompt{flex:none;padding:calc(var(--u)*.9) calc(var(--u)*1.6);display:flex;align-items:center;gap:calc(var(--u)*1.6);flex-wrap:wrap}
.qtext{font-size:1.5em;font-weight:800;flex:1 1 20em}
.ctrl{display:flex;align-items:center;gap:calc(var(--u)*1)}
.meter{display:flex;align-items:flex-end;gap:5px;height:calc(var(--u)*3.4);width:calc(var(--u)*5)}
.meter i{flex:1;background:var(--accent);border-radius:4px;height:18%;display:block;opacity:.35}
.meter.on i{opacity:1;animation:eq .5s ease-in-out infinite alternate}
.meter.on i:nth-child(2){animation-delay:-.1s}.meter.on i:nth-child(3){animation-delay:-.25s}.meter.on i:nth-child(4){animation-delay:-.05s}
.meter.on i:nth-child(5){animation-delay:-.35s}.meter.on i:nth-child(6){animation-delay:-.2s}.meter.on i:nth-child(7){animation-delay:-.4s}
@keyframes eq{from{height:15%}to{height:100%}}
.cards{flex:1;min-height:0;display:flex;gap:calc(var(--u)*1.6)}
.card{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:stretch;background:var(--card);
  border:5px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:calc(var(--u)*.8);gap:calc(var(--u)*.3);text-align:center;position:relative;transition:background .2s,border-color .2s,opacity .2s}
.card:active{transform:translateY(3px)}
.card .art{flex:1;min-height:0;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card .art svg{width:100%;height:100%;display:block}
.card .lab{font-size:1.9em;font-weight:800;line-height:1.1;display:block}
.card .sub{color:var(--ink-2);display:block}
.p-bird{background:var(--primary-soft)} .p-elephant{background:#F3E6D3} .p-rabbit{background:var(--accent-soft)}
.p-turtle{background:var(--good-soft)} .p-lion{background:var(--hint-soft)} .p-mouse{background:#EFEAF8}
.p-up{background:var(--primary-soft)} .p-down{background:#F3E6D3}
.card.good{border-color:var(--good);background:var(--good-soft)}
.card.try{border-color:var(--hint);background:var(--hint-soft);animation:nudge .5s}
.card.dim{opacity:.55}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.sp{position:absolute;font-style:normal;color:#F5B82E;font-size:1.6em;opacity:0;pointer-events:none}
.sp.s1{left:8%;top:10%}.sp.s2{right:10%;top:8%}.sp.s3{left:14%;bottom:12%}.sp.s4{right:8%;bottom:14%}
.card.good .sp{animation:sparkle 1s ease-in-out infinite}
.card.good .sp.s2{animation-delay:.2s}.card.good .sp.s3{animation-delay:.4s}.card.good .sp.s4{animation-delay:.6s}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(40deg)}}
.card.good .art svg{animation:dance .6s ease-in-out 6;transform-origin:50% 90%}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4%) rotate(-5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-4%) rotate(5deg)}}
.bottom{flex:none;display:flex;align-items:center;gap:calc(var(--u)*1.4);min-height:calc(var(--u)*5.6)}
.fb{flex:1;border-radius:16px;padding:.35em 1em;font-weight:700;min-height:64px;display:flex;align-items:center;border:3px solid transparent}
.fb.info{background:#fff;border-color:var(--line);color:var(--ink-2)}
.fb.good{background:var(--good-soft);border-color:var(--good);color:#116B47}
.fb.hint{background:var(--hint-soft);border-color:var(--hint);color:#8A5A0E}
#act[hidden]{display:none}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);text-align:center}
.result h2{margin:0;font-size:2em}
.stars{display:flex;gap:calc(var(--u)*.6);flex-wrap:wrap;justify-content:center;font-size:3.4em;line-height:1}
.stars b{color:#F5B82E;font-weight:400;animation:pop .6s ease both}
.stars span{color:#D9D2C3}
.result .row{display:flex;gap:calc(var(--u)*1.4);flex-wrap:wrap;justify-content:center}

/* ---------- animal animations (only when card has .anim) ---------- */
.art svg *{transform-box:view-box}
.anim .bird .wing{transform-origin:112px 112px;animation:flap .22s ease-in-out infinite alternate}
.anim .bird .bd{animation:bob .44s ease-in-out infinite}
@keyframes flap{from{transform:rotate(12deg)}to{transform:rotate(-32deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.anim .elephant .trunk{transform-origin:48px 116px;animation:swing 1.2s ease-in-out infinite alternate}
.anim .elephant .bd{animation:stomp 1.2s ease-in-out infinite}
.anim .elephant .ear{transform-origin:92px 80px;animation:earf 1.2s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes stomp{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes earf{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.anim .rabbit .bd{animation:hop .38s ease-in-out infinite}
.anim .rabbit .ears{transform-origin:157px 72px;animation:ears .38s ease-in-out infinite alternate}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
@keyframes ears{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.anim .turtle .bd{animation:crawl 3.2s ease-in-out infinite alternate}
.anim .turtle .leg1{transform-origin:78px 138px;animation:legs 1.6s ease-in-out infinite alternate}
.anim .turtle .leg2{transform-origin:162px 138px;animation:legs 1.6s ease-in-out infinite alternate-reverse}
.anim .turtle .head{animation:nod 1.6s ease-in-out infinite alternate}
@keyframes crawl{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes legs{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes nod{from{transform:translate(0,0)}to{transform:translate(4px,3px)}}
.lion .bd{transform-origin:120px 100px}
.anim .lion .bd{animation:pulse 1s ease-in-out infinite}
.anim .lion .mouth{transform-origin:120px 132px;animation:roar 1s ease-in-out infinite}
.lion .wv{opacity:0}
.anim .lion .wv{animation:wave 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes roar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(7)}}
@keyframes wave{0%,100%{opacity:0}50%{opacity:1}}
.anim .mouse .bd{animation:tremble .1s linear infinite alternate}
@keyframes tremble{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}
.anim .stairs-up .walk{animation:climb 3s ease-in-out infinite}
.anim .stairs-down .walk{animation:descend 3s ease-in-out infinite}
@keyframes climb{0%,8%{transform:translate(0,0)}22%,32%{transform:translate(34px,-26px)}46%,56%{transform:translate(68px,-52px)}70%,80%{transform:translate(102px,-78px)}94%,100%{transform:translate(136px,-104px)}}
@keyframes descend{0%,8%{transform:translate(0,0)}22%,32%{transform:translate(34px,26px)}46%,56%{transform:translate(68px,52px)}70%,80%{transform:translate(102px,78px)}94%,100%{transform:translate(136px,104px)}}

@media (max-aspect-ratio:1/1){
  body{overflow:auto}
  .stage{height:auto;min-height:100dvh}
  .cards{flex-direction:column}
  .card{min-height:300px}
  .catbtn{width:90vw}
  .top{flex-wrap:wrap}
  :root{--u:1.6vw}
}
/* MacBook Air / 短螢幕 + 複製 Prompt 按鈕留位 */
.bottom{padding-right:190px}
.foot{display:none}
@media (max-height:760px){
  body{font-size:max(22px,calc(var(--u)*1.45))}
  .btn,.badge,.modebtn,.fb{min-height:52px}
  .btn.big{min-height:max(52px,calc(var(--u)*5.2))}
  .result h2{font-size:1.6em}.stars{font-size:2.6em}
  .setup{gap:calc(var(--u)*1)}
  .card{border-width:4px;padding:calc(var(--u)*.6)}
  .card .lab{font-size:1.6em}
}
@media (max-width:900px){.bottom{padding-right:0;padding-bottom:64px;flex-wrap:wrap}.top{flex-wrap:wrap}h1{white-space:normal}}
@media (prefers-reduced-motion:reduce){
  .card.good .art svg{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <header class="top">

    <div class="r">
      <div class="badge" id="badge" hidden></div>
      <button class="btn ghost" id="fs" type="button">⛶ 全螢幕</button>
      <button class="btn ghost" id="rs" type="button">↺ 重新開始</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="foot">AI 輔助備課工作坊 · 示範教具</div>

/* ---------- TTS ---------- */
function pickVoice(lang){
 try{
  var vs=window.speechSynthesis.getVoices()||[];
  var norm=function(x){return String(x||'').replace('_','-').toLowerCase();};
  var l=lang.toLowerCase(), v=null, i;
  for(i=0;i<vs.length;i++){if(norm(vs[i].lang)===l){v=vs[i];break;}}
  if(!v){var p=l.split('-')[0];for(i=0;i<vs.length;i++){if(norm(vs[i].lang).indexOf(p)===0){v=vs[i];break;}}}
  return v;
 }catch(e){return null;}
}
function ttsFallback(text,opt){
 opt=opt||{};
 try{
  if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance){if(opt.onend)opt.onend();return;}
  var u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';
  var v=pickVoice('zh-HK');if(v)u.voice=v;u.rate=.9*(opt.rate||1);
  u.onend=function(){if(opt.onend)opt.onend();};u.onerror=u.onend;
  window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
 }catch(e){if(opt.onend)opt.onend();}
}
var VOICE=(function(){
 var cur=null;
 var norm=function(s){return String(s).replace(/\s+/g,'');};
 var lookup=function(t){return (window.VOICE_LINES||{})[norm(t)];};
 function stop(){if(cur){cur.onended=null;try{cur.pause();}catch(e){}cur=null;}try{window.speechSynthesis.cancel();}catch(e){}}
 function speak(text,opt){
  opt=opt||{};stop();
  var src=lookup(text);
  if(src){
   try{
    var a=new Audio(src);cur=a;
    a.playbackRate=opt.rate||1;a.preservesPitch=true;
    a.onended=function(){if(cur===a)cur=null;if(opt.onend)opt.onend();};
    a.onerror=function(){cur=null;ttsFallback(text,opt);};
    var pr=a.play();if(pr&&pr.catch)pr.catch(function(){cur=null;ttsFallback(text,opt);});
    return;
   }catch(e){cur=null;}
  }
  ttsFallback(text,opt);
 }
 return {speak:speak,stop:stop};
})();
function speak(text,opt){VOICE.speak(text,opt);}
function sayAfter(text,ms){timers.push(setTimeout(function(){speak(text);},ms));}

/* ---------- Web Audio 合成 ---------- */
var ctx=null, master=null, bus=null, timers=[];
var PENT=[261.63,293.66,329.63,392.00,440.00];
function pf(i){return PENT[i%5]*Math.pow(2,Math.floor(i/5));}
function ensureAudio(){
 try{
  if(ctx){if(ctx.state==='suspended'&&ctx.resume)ctx.resume();return true;}
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  ctx=new AC();
  var comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-4;comp.knee.value=6;comp.ratio.value=6;comp.attack.value=.005;comp.release.value=.2;
  master=ctx.createGain();master.gain.value=.85;
  master.connect(comp);comp.connect(ctx.destination);
  return true;
 }catch(e){ctx=null;return false;}
}
function stopSound(){
 var i;for(i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];
 if(bus&&ctx){
  try{bus.gain.cancelScheduledValues(ctx.currentTime);bus.gain.setTargetAtTime(0,ctx.currentTime,.02);}catch(e){}
  var old=bus;setTimeout(function(){try{old.disconnect();}catch(e){}},350);
 }
 bus=null;
}
function newBus(){
 stopSound();
 if(!ctx)return null;
 try{bus=ctx.createGain();bus.gain.value=1;bus.connect(master);}catch(e){bus=null;}
 return bus;
}
/* 一個音：三角波＋八度泛音，低通濾波，ADSR 包絡 */
function tone(f,t0,dur,vol,o){
 if(!ctx||!bus)return;
 o=o||{};
 try{
  var o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lp=ctx.createBiquadFilter();
  o1.type=o.type||'triangle';o1.frequency.value=f;
  o2.type='sine';o2.frequency.value=f*2;g2.gain.value=(o.h2==null?.25:o.h2);
  lp.type='lowpass';lp.frequency.value=o.lp||3000;lp.Q.value=.5;
  var a=.025,d=.09,s=.7,r=Math.min(.28,Math.max(.08,dur*.5));
  var hold=Math.max(t0+a+d,t0+dur);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+a);
  g.gain.linearRampToValueAtTime(vol*s,t0+a+d);
  g.gain.setValueAtTime(vol*s,hold);
  g.gain.exponentialRampToValueAtTime(.0001,hold+r);
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);lp.connect(bus);
  o1.start(t0);o2.start(t0);o1.stop(hold+r+.05);o2.stop(hold+r+.05);
 }catch(e){}
}
/* 播放題目聲音；off=延遲秒數；回傳結束時間（距而家秒數） */
function playOpt(q,id,off){
 var t0=ctx.currentTime+.08+off,len=0,k,n,rep;
 if(q.cat==='pitch'){
  var hi=id==='high';
  for(n=0;n<q.m.length;n++){
   tone(hi?pf(q.m[n])*4:pf(q.m[n])/2,t0+n*.42,.4,hi?.17:.34,{type:hi?'sine':'triangle',h2:hi?.12:.5,lp:hi?3600:1800});
  }
  len=q.m.length*.42+.3;
 }else if(q.cat==='tempo'){
  var fast=id==='fast';
  if(fast){
   for(rep=0;rep<3;rep++)for(n=0;n<q.m.length;n++)tone(pf(q.m[n]),t0+(rep*q.m.length+n)*.17,.13,.24,{});
   len=q.m.length*3*.17+.2;
  }else{
   for(n=0;n<q.m.length;n++)tone(pf(q.m[n]),t0+n*.6,.56,.24,{});
   len=q.m.length*.6+.3;
  }
 }else if(q.cat==='dynamics'){
  var v=id==='loud'?.42:.055;
  for(n=0;n<q.m.length;n++)tone(pf(q.m[n]+2),t0+n*.45,.42,v,{});
  len=q.m.length*.45+.3;
 }else if(q.cat==='direction'){
  var notes=[];for(k=0;k<5;k++)notes.push(pf(q.s+k));
  if(id==='down')notes.reverse();
  for(n=0;n<5;n++)tone(notes[n],t0+n*.38,n===4?.8:.34,.26,{});
  len=5*.38+.6;
 }
 return off+.08+len;
}
function ding(){
 if(!ensureAudio())return;newBus();if(!ctx||!bus)return;
 var t=ctx.currentTime+.05;
 tone(1318.5,t,.5,.2,{type:'sine',h2:.1});
 tone(1975.5,t+.13,.9,.16,{type:'sine',h2:.08});
}
function softBoo(){
 if(!ctx||!bus)return;
 var t=ctx.currentTime+.03;
 tone(262,t,.3,.09,{type:'sine',h2:.1,lp:1200});
}

/* ---------- 出題 ---------- */
function buildQs(){
 var cats=state.cat==='mix'?shuffle(['pitch','tempo','dynamics','direction','pitch','tempo','dynamics','direction','pitch','tempo']):(function(){var a=[];for(var i=0;i<N;i++)a.push(state.cat);return a;})();
 var cnt={},tg={};
 cats.forEach(function(c){cnt[c]=(cnt[c]||0)+1;});
 Object.keys(cnt).forEach(function(c){var a=[];for(var k=0;k<cnt[c];k++)a.push(k%2);tg[c]=shuffle(a);});
 return cats.map(function(c){
  var o=CATS[c].opts[tg[c].pop()];
  var q={cat:c,target:o.id,flip:Math.random()<.5,wrong:false,done:false,m:[],s:rnd(5)};
  var len=c==='tempo'?6:5,max=c==='pitch'?5:7,tries=0;
  do{q.m=[];for(var k=0;k<len;k++)q.m.push(rnd(max));tries++;}while(tries<20&&q.m.every(function(x){return x===q.m[0];}));
  return q;
 });
}

/* ---------- 動作 ---------- */
function doPlay(){
 var q=cur();if(!q)return;
 if(!ensureAudio()){setFb('呢部裝置播唔到聲音，請檢查喇叭或者轉用另一個瀏覽器。','hint');return;}
 clearAnims();
 if(!newBus())return;
 var end=playOpt(q,q.target,0);
 state.played=true;
 var pb=$('#playbtn');if(pb)pb.textContent='🔁 再聽一次';
 setMeter(end*1000);
 if(!q.done)setFb(state.mode==='teacher'?'播放緊……聽完可以再聽一次，或者兩個一齊聽。':'聽完喇！點一個你認為啱嘅圖示。','info');
}
function doCompare(lead,keep){
 var q=cur();if(!q)return;
 if(!ensureAudio()){setFb('呢部裝置播唔到聲音。','hint');return;}
 clearAnims();
 if(!keep){if(!newBus())return;}
 lead=lead||0;
 var vo=visualOpts(q),A=vo[0],B=vo[1];
 var endA=playOpt(q,A.id,lead);
 var startB=endA+.45;
 var endB=playOpt(q,B.id,startB);
 timers.push(setTimeout(function(){animCard(A.id,(endA-lead)*1000+150);},lead*1000));
 timers.push(setTimeout(function(){animCard(B.id,(endB-startB)*1000+150);},startB*1000));
 setMeter(endB*1000);
 state.played=true;
 var pb=$('#playbtn');if(pb)pb.textContent='🔁 再聽一次';
 if(!q.done)setFb('先聽「'+A.label+'」（'+A.sub+'），再聽「'+B.label+'」（'+B.sub+'）。','info');
}
function demo(id){
 var q=cur();if(!q||!ensureAudio())return;
 clearAnims();if(!newBus())return;
 var end=playOpt(q,id,0);
 animCard(id,end*1000);setMeter(end*1000);
}
function pick(id){
 var q=cur();if(!q)return;
 var teacher=state.mode==='teacher';
 if(teacher||q.done){demo(id);return;}
 if(!state.played){
  setFb('先撳 ▶ 播放，聽一聽先喇～','hint');return;
 }
 var o=CATS[q.cat].opts.filter(function(x){return x.id===id;})[0];
 var el=cardEl(id);if(!el||!o)return;
 if(id===q.target){
  q.done=true;
  var first=!q.wrong;
  if(first){state.score++;}
  state.results[state.i]=first;
  stopSound();clearAnims();
  el.classList.remove('try');el.classList.add('good','anim');
  $$('.card',app).forEach(function(x){if(x!==el)x.classList.add('dim');});
  ding();sayAfter(correctLine(o),700);
  setFb('答啱喇！'+(first?'你攞到一粒星 ⭐ ':'')+'呢個係'+o.say+'～','good');
  setAct(state.i>=N-1?'完成 ▶':'下一題 ▶','next');
  updateBadge(first);
 }else{
  q.wrong=true;
  el.classList.remove('try');void el.offsetWidth;el.classList.add('try');
  animCard(id,1200);
  setFb('差少少呀～'+CATS[q.cat].hint+'（兩個聲音會再播一次）','hint');
  if(ensureAudio()){newBus();softBoo();}
  speak(wrongLine(q),{onend:function(){if(state.screen==='quiz'&&cur()===q&&!q.done)doCompare(.2,false);}});
 }
}
function reveal(){
 var q=cur();if(!q||q.done)return;
 q.done=true;
 var o=CATS[q.cat].opts.filter(function(x){return x.id===q.target;})[0];
 var el=cardEl(q.target);
 stopSound();clearAnims();
 if(el){el.classList.add('good','anim');}
 $$('.card',app).forEach(function(x){if(x!==el)x.classList.add('dim');});
 ding();sayAfter(revealLine(o),700);
 setFb('答案：'+o.label+'（'+o.sub+'）——'+o.say+'。',' good'.trim());
 setAct(state.i>=N-1?'完成 ▶':'下一題 ▶','next');
}
function next(){
 state.i++;
 if(state.i>=N)renderResult();else renderQuiz();
}
function renderResult(){
 state.screen='result';stopAll();updateBadge();
 var teacher=state.mode==='teacher',h;
 if(teacher){
  h='<div class="result"><h2>🎉 '+N+' 題完成！</h2><div>多謝大家用心聽。想再玩可以揀同一類，或者轉類別。</div>';
 }else{
  var st='',k;
  for(k=0;k<N;k++)st+=state.results[k]===true?'<b style="animation-delay:'+(k*.08)+'s">★</b>':'<span>☆</span>';
  var msg=state.score>=9?'太棒喇！你係小小音樂家！':(state.score>=6?'好叻！繼續加油！':'再聽多幾次，一定會更叻！');
  h='<div class="result"><h2>你攞到 '+state.score+' 粒星！</h2><div class="stars">'+st+'</div><div>'+msg+'</div>';
 }
 h+='<div class="row"><button type="button" class="btn good big" data-act="again">🔁 再玩一輪</button><button type="button" class="btn ghost big" data-act="setup">揀其他類別</button></div></div>';
 app.innerHTML=h;
 if(!teacher&&ensureAudio()&&state.score>=6){ding();}
}

/* ---------- 事件 ---------- */
app.addEventListener('click',function(e){
 var t=e.target;
 while(t&&t!==app&&!(t.getAttribute&&t.getAttribute('data-act')))t=t.parentNode;
 if(!t||t===app)return;
 var act=t.getAttribute('data-act'),v=t.getAttribute('data-v');
 if(act==='cat'){state.cat=v;$$('.catbtn',app).forEach(function(b){b.classList.toggle('sel',b.getAttribute('data-v')===v);});}
 else if(act==='mode'){state.mode=v;$$('.modebtn',app).forEach(function(b){b.classList.toggle('sel',b.getAttribute('data-v')===v);});}
 else if(act==='start'||act==='again'){ensureAudio();startRound();}
 else if(act==='setup'){renderSetup();}
 else if(act==='play'){doPlay();}
 else if(act==='compare'){doCompare(0,false);}
 else if(act==='read'){var q=cur();if(q)speak(CATS[q.cat].q);}
 else if(act==='pick'){pick(t.getAttribute('data-opt'));}
 else if(act==='reveal'){reveal();}
 else if(act==='next'){next();}
});
var rs=$('#rs'),fs=$('#fs');
if(rs)rs.addEventListener('click',function(){stopAll();try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}state.score=0;state.results=[];renderSetup();});
if(fs)fs.addEventListener('click',function(){
 try{
  var d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
  else{var f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el);}
 }catch(e){}
});
try{if(window.speechSynthesis&&window.speechSynthesis.getVoices)window.speechSynthesis.getVoices();}catch(e){}

renderSetup();
})();
</script>

<script src="tool-extras.js"></script>
