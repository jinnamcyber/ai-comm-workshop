<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小水滴去旅行</title>
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#1F2A44; --ink-2:#5B6478; --line:#E8DFCF;
  --primary:#2F6FED; --primary-soft:#E3ECFF;
  --good:#1E9E6A; --good-soft:#DDF5EA;
  --hint:#E9A23B; --hint-soft:#FFF1D6;
  --accent:#E8618C; --accent-soft:#FDE4EC;
  --radius:22px; --shadow:0 6px 0 rgba(31,42,68,.08), 0 14px 30px rgba(31,42,68,.08);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:24px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px clamp(12px,2vw,32px);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.chip{background:var(--accent-soft);color:var(--accent);font-weight:800;padding:8px 18px;border-radius:999px;font-size:24px;white-space:nowrap}
h1{margin:0;font-size:clamp(28px,2.6vw,42px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:12px}
.btn{min-height:64px;min-width:64px;padding:0 26px;border:0;border-radius:18px;font:inherit;font-weight:800;font-size:clamp(24px,1.9vw,30px);color:var(--ink);background:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.14);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(31,42,68,.14)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--primary);color:#fff;box-shadow:0 6px 0 #1B4DB3}
.btn.pri:active{box-shadow:0 1px 0 #1B4DB3}
.btn.go{background:var(--good);color:#fff;box-shadow:0 6px 0 #137A50}
.btn.go:active{box-shadow:0 1px 0 #137A50}
.btn.warn{background:var(--hint);color:#fff;box-shadow:0 6px 0 #B97A1F}
.btn:focus-visible,.dot:focus-visible{outline:4px solid var(--primary);outline-offset:3px}
main{flex:1 1 auto;min-height:200px;display:flex;align-items:center;justify-content:center;padding:0 clamp(8px,2vw,32px);container-type:size}
#stage{display:block;width:min(100cqw,200cqh);height:auto;aspect-ratio:2/1;border-radius:26px;box-shadow:var(--shadow);border:6px solid #fff;background:#fff;touch-action:none}
.caption{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:10px clamp(12px,2vw,32px) 0;flex-wrap:wrap}
.step{background:var(--primary-soft);color:var(--primary);font-weight:900;padding:8px 20px;border-radius:999px;font-size:clamp(24px,2vw,32px);white-space:nowrap}
#cap{flex:1 1 320px;font-size:clamp(26px,2.7vw,46px);font-weight:900;line-height:1.25;min-width:0}
#hint{background:var(--hint-soft);color:#8A5A0E;font-weight:800;padding:8px 20px;border-radius:999px;font-size:clamp(24px,1.9vw,30px);border:3px solid var(--hint)}
#hint.bad{animation:shake .5s}
#hint.hide{visibility:hidden}
nav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,22px);padding:12px clamp(12px,2vw,32px) 4px;flex-wrap:wrap}
.dots{display:flex}
.dot{width:64px;height:64px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dot i{display:block;width:26px;height:26px;border-radius:50%;background:#D8D2C4;border:4px solid #fff;box-shadow:0 2px 0 rgba(31,42,68,.2);transition:all .3s}
.dot.on i{background:var(--primary);width:38px;height:38px}
.dot.done i{background:var(--good)}
footer{flex:0 0 auto;text-align:right;font-size:14px;color:var(--ink-2);padding:2px clamp(12px,2vw,32px) 6px}
/* SVG scenes */
.scene{opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
.scene.on{opacity:1;visibility:visible;transition:opacity .6s}
.dslot{cursor:pointer}
.bob{animation:bob 2.6s ease-in-out infinite}
.bob.b2{animation-duration:3.1s;animation-delay:-1s}
.bob.b3{animation-duration:2.2s;animation-delay:-.5s}
@keyframes bob{0%,100%{transform:translateY(-5px)}50%{transform:translateY(7px)}}
.drop .mo,.drop .sweat{display:none}
.drop.m-happy .mo-happy,.drop.m-wow .mo-wow,.drop.m-hot .mo-hot,.drop.m-hmm .mo-hmm,.drop.m-hot .sweat{display:inline}
.eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.pulse{fill:none;stroke:var(--hint);stroke-width:7;stroke-dasharray:14 12;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite;pointer-events:none}
.pulse.off{display:none}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.9}50%{transform:scale(1.12);opacity:.45}}
.wave{animation:wave 5s linear infinite}
.wave.w2{animation-duration:7s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-120px)}}
.rays{transform-origin:0 0;animation:spin 22s linear infinite}
.rays.fast{animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg)}}
#sunBody{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
#sunWrap.bump{animation:bump .5s}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
#sunWrap{transform-box:fill-box;transform-origin:center}
.vap{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;opacity:0;animation:vap 3s ease-in infinite}
@keyframes vap{0%{transform:translateY(0);opacity:0}20%{opacity:.85}100%{transform:translateY(-170px);opacity:0}}
#vapor{transition:opacity 1s}
.heat{fill:none;stroke:#FF8A2B;stroke-width:6;stroke-linecap:round;opacity:0;transition:opacity .6s}
.drift{animation:drift 40s linear infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
.cloud3{transform-box:fill-box;transform-origin:center}
.cloud3.shake{animation:cshake .5s 3}
@keyframes cshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.rain{opacity:0}
.raining .rain{animation:fall 1.1s linear infinite}
@keyframes fall{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(115px);opacity:0}}
.rain.heavy{display:none}
.heavyon .rain.heavy{display:inline}
.ripple{fill:none;stroke:#fff;stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:center}
.raining .ripple{animation:ripple 1.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.flow{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-dasharray:4 40;opacity:.7;animation:flowd 1.2s linear infinite}
@keyframes flowd{to{stroke-dashoffset:-44}}
.arrow{fill:none;stroke-width:12;stroke-linecap:round;stroke-dasharray:22 16;animation:flowd2 1.1s linear infinite}
@keyframes flowd2{to{stroke-dashoffset:-38}}
.node{cursor:pointer}
.node .nb{transform-box:fill-box;transform-origin:center;transition:transform .25s}
.node.hit .nb{animation:nodepop .7s}
@keyframes nodepop{0%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.96)}100%{transform:scale(1)}}
.node .ck{display:none}
.node.seen .ck{display:inline}
.node .ring{fill:none;stroke-width:8;opacity:0}
.node.hit .ring{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#cloud2{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .8s,transform .8s cubic-bezier(.3,1.5,.5,1);transform:scale(.85)}
#cloud2.on{opacity:1;transform:scale(1)}
.link{opacity:0;transition:opacity .4s}
.link.on{opacity:1}
.star{transform-box:fill-box;transform-origin:center;animation:twk 1.6s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.1);opacity:1}}
/* MacBook Air / 短螢幕 + 複製 Prompt 按鈕留位 */
footer{display:none}
nav{padding-right:clamp(12px,2vw,32px);padding-bottom:6px}
@media (min-width:901px){nav{padding-right:210px}}
@media (max-height:760px){
  header{padding-top:4px;padding-bottom:4px}
  .btn{min-height:52px;font-size:clamp(20px,1.7vw,26px)}
  .chip,.step{padding:5px 14px}
  h1{font-size:clamp(24px,2.2vw,34px)}
  #cap{font-size:clamp(22px,2.3vw,38px)}
  .caption{padding-top:4px}
  nav{padding-top:6px;padding-bottom:4px}
  .dot{width:48px;height:52px}
  main{min-height:160px}
}
@media (max-width:900px){nav{padding-bottom:70px}body{overflow:auto;height:auto;min-height:100dvh}main{min-height:0;container-type:normal;display:block;padding-top:8px}#stage{width:100%}}
@media (max-width:720px){
  .chip{font-size:20px;padding:6px 12px}
  .btn{padding:0 16px}
  .dot{width:48px}
}
@media (prefers-reduced-motion:reduce){
  .bob,.rays,.wave,.drift{animation:none}
}
</style>
</head>

<header>

  <div class="hbtns">

<main>

</defs>

</svg>
</main>

function eio(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
function tween(ms,fn,done,ease){
  var t={c:false};tw.push(t);var t0=null;
  function f(n){
    if(t.c)return;
    if(t0===null)t0=n;
    var p=Math.min(1,(n-t0)/ms);
    try{fn((ease||eio)(p));}catch(e){}
    if(p<1)requestAnimationFrame(f);else if(done){try{done();}catch(e){}}
  }
  requestAnimationFrame(f);return t;
}

/* ---------- 聲音 ---------- */
var AC=null;
function ding(a,b,c){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    [a,b,c].forEach(function(f,i){
      if(!f)return;
      var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.12;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.6);
    });
  }catch(e){}
}
var voices=[];
function loadV(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
loadV();
try{if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadV;}}catch(e){}
function norm(l){return (l||'').replace('_','-').toLowerCase();}
function pickVoice(lang){
  var L=lang.toLowerCase(),base=L.split('-')[0];
  var v=voices.filter(function(x){return norm(x.lang)===L;})[0];
  if(!v&&L==='zh-hk')v=voices.filter(function(x){return /^yue/.test(norm(x.lang));})[0];
  if(!v)v=voices.filter(function(x){return norm(x.lang).indexOf(base)===0;})[0];
  return v||null;
}
function ttsFallback(text,opt){
  opt=opt||{};
  try{
    var s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance){if(opt.onend)setTimeout(opt.onend,1500);return;}
    s.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-HK';var v=pickVoice('zh-HK');if(v)u.voice=v;
    u.rate=.88;u.pitch=1.15;
    if(opt.onend){u.onend=opt.onend;u.onerror=opt.onend;}
    s.speak(u);
  }catch(e){if(opt.onend)setTimeout(opt.onend,1500);}
}
var VOICE=(function(){
  var cur=null;
  function norm(s){return String(s).replace(/\s+/g,'');}
  function lookup(t){return (window.VOICE_LINES||{})[norm(t)];}
  function stop(){if(cur){cur.onended=null;try{cur.pause();}catch(e){}cur=null;}try{window.speechSynthesis.cancel();}catch(e){}}
  function speak(text,opt){
    opt=opt||{};stop();
    var src=lookup(text);
    if(src){
      try{
        var a=new Audio(src);cur=a;a.playbackRate=opt.rate||1;
        a.onended=function(){if(cur===a)cur=null;if(opt.onend)opt.onend();};
        a.onerror=function(){cur=null;ttsFallback(text,opt);};
        var pr=a.play();if(pr&&pr.catch)pr.catch(function(){cur=null;ttsFallback(text,opt);});
        return;
      }catch(e){cur=null;}
    }
    ttsFallback(text,opt);
  }
  return {speak:speak,stop:stop};
})();
function speak(text,opt){VOICE.speak(text,opt);}

function Drop(id,grad,x,y,s){

})();

/* ---------- 第5幕 ---------- */
var s5={seen:{},orbit:true};
var CX=640,CY=325,RX=400,RY=210;
function iconHTML(i){
  function cl(tx,ty,sc,fill,st){return '<use href="#cloudShape" transform="translate('+tx+','+ty+') scale('+sc+')" fill="none" stroke="'+st+'" stroke-width="16"/><use href="#cloudShape" transform="translate('+tx+','+ty+') scale('+sc+')" fill="'+fill+'"/>';}
  if(i===0)return '<circle cx="-24" cy="-26" r="15" fill="#FFC93C" stroke="#F29E1F" stroke-width="4"/>'+
    '<path d="M6,-4 q8,-9 0,-18 t0,-18 M22,-4 q8,-9 0,-18 t0,-18 M38,-4 q8,-9 0,-18 t0,-18" stroke="#F29E1F" stroke-width="5" fill="none" stroke-linecap="round" transform="translate(-4,6) scale(.9)"/>';
  if(i===1)return cl(0,-26,.36,'#fff','#8FA9D6')+'<path d="M-30,-4 q8,-8 0,-16" stroke="#8FA9D6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0"/>';
  if(i===2)return cl(0,-38,.34,'#C9D3E3','#7C93B5')+
    '<use href="#rdrop" transform="translate(-24,2) scale(.9)" fill="#3FA9F5"/><use href="#rdrop" transform="translate(0,8) scale(.9)" fill="#3FA9F5"/><use href="#rdrop" transform="translate(24,2) scale(.9)" fill="#3FA9F5"/>';
  return '<path d="M-48,-22 q12,-12 24,0 t24,0 t24,0 t24,0" stroke="#2F8BEA" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M-48,-6 q12,-12 24,0 t24,0 t24,0 t24,0" stroke="#6CC4FF" stroke-width="7" fill="none" stroke-linecap="round"/>';
}
(function build5(){
  var i,ah='',nh='';
  var gaps=[[30,20],[20,30],[30,20],[20,30]];
  function pt(a){var r=a*Math.PI/180;return [CX+RX*Math.cos(r),CY+RY*Math.sin(r)];}
  for(i=0;i<4;i++){
    var a0=NODES[i].ang+gaps[i][0],a1=NODES[i].ang+90-gaps[i][1];
    var p0=pt(a0),p1=pt(a1);
    ah+='<path class="arrow" d="M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+' A'+RX+','+RY+' 0 0 1 '+p1[0].toFixed(1)+','+p1[1].toFixed(1)+'" stroke="'+NODES[(i+1)%4].col+'" marker-end="url(#arr'+((i+1)%4)+')"/>';
  }
  setHTML('arrows5',ah);
  for(i=0;i<4;i++){
    var n=NODES[i],p=pt(n.ang);
    nh+='<g class="node" id="n'+i+'" transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')" role="button" tabindex="0" aria-label="'+n.name+'">'+
      '<g class="nb"><circle r="84" fill="'+n.fill+'" stroke="'+n.col+'" stroke-width="8"/>'+
      iconHTML(i)+
      '<text y="58" text-anchor="middle" font-size="36" font-weight="900" fill="#1F2A44">'+n.name+'</text>'+
      '<circle cx="-62" cy="-62" r="20" fill="'+n.col+'"/><text x="-62" y="-53" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">'+(i+1)+'</text>'+
      '<g class="ck"><circle cx="62" cy="-62" r="20" fill="#1E9E6A" stroke="#fff" stroke-width="4"/><path d="M52,-62 l7,8 l12,-15" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>'+
      '</g><circle class="ring" r="96" stroke="'+n.col+'"/><circle r="92" fill="transparent"/></g>';
  }
  setHTML('nodes5',nh);
  for(i=0;i<4;i++){(function(k){
    var e=$('#n'+k);if(!e)return;
    e.addEventListener('click',function(){if(cur===4)tapNode(k);});
    e.addEventListener('keydown',function(ev){if(cur===4&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();tapNode(k);}});
  })(i);}
})();
function tapNode(k){
  var e=$('#n'+k);if(!e)return;
  e.classList.remove('hit');void e.getBBox();e.classList.add('hit');
  later(900,function(){e.classList.remove('hit');});
  e.classList.add('seen');s5.seen[k]=true;
  ding(523+k*110);
  setCap('⑤ '+NODES[k].name,NODES[k].say.replace(/^[^！]*！/,''));
  speak(NODES[k].say);
  var all=NODES.every(function(n,j){return s5.seen[j];});
  if(all&&!s5.all){s5.all=true;later(2600,function(){ding(784,988,1319);speak('你識晒水循環喇，好叻呀！');});}
}
function enter5(){
  s5.seen={};s5.all=false;
  for(var i=0;i<4;i++){var e=$('#n'+i);if(e){e.classList.remove('seen','hit');}}
  var ang=180,last=null;d5.mood('happy');
  var t={c:false};tw.push(t);
  (function f(n){
    if(t.c)return;
    if(last===null)last=n;
    ang+= (n-last)*0.045;last=n;
    var r=ang*Math.PI/180;
    d5.put(CX+300*Math.cos(r),CY+118*Math.sin(r)+ (Math.sin(n/300)*3),.5);
    requestAnimationFrame(f);
  })(performance.now());
  if(auto){later(2500,function(){tapNode(0);});later(5000,function(){tapNode(1);});later(7400,function(){tapNode(2);});later(9800,function(){tapNode(3);});}
}

/* ---------- 導航 ---------- */
var ENTER=[enter1,enter2,enter3,enter4,enter5];
var scenes=[].slice.call(document.querySelectorAll('.scene'));
var dotsEl=$('#dots'),btnPrev=$('#btnPrev'),btnNext=$('#btnNext'),btnAuto=$('#btnAuto');
var visited={},autoTok=0,MINT=[9800,8800,8500,11000,11500];
function buildDots(){
  if(!dotsEl)return;
  var i;for(i=0;i<5;i++){(function(k){
    var b=document.createElement('button');b.type='button';b.className='dot';b.setAttribute('aria-label','第'+(k+1)+'幕');
    b.innerHTML='<i></i>';b.addEventListener('click',function(){go(k);});dotsEl.appendChild(b);
  })(i);}
}
buildDots();
function ensureAudio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function go(i){
  i=Math.max(0,Math.min(4,i));
  cancelAll();clearTimeout(autoT);
  cur=i;visited[i]=true;
  scenes.forEach(function(s,k){s.classList.toggle('on',k===i);});
  var ds=dotsEl?dotsEl.children:[];
  for(var k=0;k<ds.length;k++){ds[k].classList.toggle('on',k===i);ds[k].classList.toggle('done',k!==i&&!!visited[k]);}
  setCap(SC[i].chip,SC[i].nar);setHint(SC[i].hint);
  if(btnPrev)btnPrev.disabled=(i===0);
  if(btnNext)btnNext.textContent=(i===4)?'↺ 再玩一次':'下一步 ▶';
  ENTER[i]();
  var onend=null;
  if(auto){
    var tok=++autoTok,nd=false,md=false;
    var adv=function(){
      if(tok!==autoTok||!auto||!nd||!md)return;
      if(i<4)go(i+1);else setAuto(false);
    };
    onend=function(){later(1200,function(){nd=true;adv();});};
    later(MINT[i],function(){md=true;adv();});
    later(SC[i].dur+6000,function(){nd=true;md=true;adv();});
  }
  speak(SC[i].nar,onend?{onend:onend}:undefined);
}
function setAuto(on){
  auto=on;
  if(btnAuto){btnAuto.textContent=on?'⏸ 暫停':'▶ 自動播放';btnAuto.classList.toggle('warn',on);btnAuto.classList.toggle('go',!on);}
  if(!on){clearTimeout(autoT);}
}
if(btnPrev)btnPrev.addEventListener('click',function(){ensureAudio();go(cur-1);});
if(btnNext)btnNext.addEventListener('click',function(){ensureAudio();go(cur===4?0:cur+1);});
if(btnAuto)btnAuto.addEventListener('click',function(){
  ensureAudio();
  if(auto){setAuto(false);return;}
  setAuto(true);go(cur===4?0:cur);
});
var btnSay=$('#btnSay');
if(btnSay)btnSay.addEventListener('click',function(){ensureAudio();speak(SC[cur].nar);});
var btnReset=$('#btnReset');
if(btnReset)btnReset.addEventListener('click',function(){
  ensureAudio();visited={};setAuto(false);try{window.speechSynthesis.cancel();}catch(e){}go(0);
});
var btnFull=$('#btnFull');
if(btnFull)btnFull.addEventListener('click',function(){
  try{
    var d=document;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{var r=d.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen).call(r);}
  }catch(e){}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
});
document.addEventListener('pointerdown',function(){ensureAudio();},{once:true});
go(0);
})();
</script>
<script src="prompts.js"></script>
<script src="tool-extras.js"></script>
</body>
