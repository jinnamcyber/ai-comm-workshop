<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乘法口訣晨操</title>
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#1F2A44; --ink-2:#5B6478; --line:#E8DFCF;
  --primary:#2F6FED; --primary-soft:#E3ECFF;
  --good:#1E9E6A; --good-soft:#DDF5EA;
  --hint:#E9A23B; --hint-soft:#FFF1D6;
  --accent:#E8618C; --accent-soft:#FDE4EC;
  --radius:22px; --shadow:0 6px 0 rgba(31,42,68,.08), 0 14px 30px rgba(31,42,68,.08);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --u:min(1vw,1.7778vh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:24px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
#stage{width:min(100vw,177.78vh);height:min(100vh,56.25vw);margin:0 auto;position:relative;display:flex;flex-direction:column;padding:calc(var(--u)*1.2) calc(var(--u)*2) calc(var(--u)*2.2)}
@media (max-aspect-ratio:1/1){
  :root{--u:2.2vw}
  #stage{width:100vw;height:100vh}
}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex:none}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.chip{background:var(--primary);color:#fff;font-weight:800;padding:8px 20px;border-radius:999px;font-size:24px;white-space:nowrap}
.title{font-size:clamp(26px,calc(var(--u)*2.4),46px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:12px;flex:none}
.btn{min-height:64px;padding:0 28px;border-radius:18px;font-size:24px;font-weight:800;background:var(--card);box-shadow:0 5px 0 rgba(31,42,68,.14);border:2px solid var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(31,42,68,.14)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 5px 0 #1f4fb5}
.btn.primary:active{box-shadow:0 1px 0 #1f4fb5}
.btn.good{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 5px 0 #146b47}
.btn.good:active{box-shadow:0 1px 0 #146b47}
.btn.big{min-height:84px;font-size:clamp(28px,calc(var(--u)*2.4),44px);padding:0 52px;border-radius:24px}
.btn[disabled]{opacity:.45;pointer-events:none}
.foot{position:fixed;right:14px;bottom:8px;font-size:14px;color:var(--ink-2);pointer-events:none;z-index:5}

.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* setup */
#setup{align-items:center;justify-content:center;gap:calc(var(--u)*1.4);padding-top:8px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);width:100%;max-width:calc(var(--u)*78)}
.panel h3{font-size:clamp(24px,calc(var(--u)*1.8),34px);margin-bottom:12px;display:flex;align-items:center;gap:12px}
.panel h3 small{font-size:24px;color:var(--ink-2);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:12px}
.opt{min-width:64px;min-height:64px;padding:0 22px;border-radius:18px;font-size:clamp(26px,calc(var(--u)*2),38px);font-weight:900;background:var(--bg);border:3px solid var(--line);color:var(--ink-2);transition:all .12s}
.opt.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);box-shadow:0 4px 0 rgba(47,111,237,.35)}
.opt.tbl{flex:1;min-width:calc(var(--u)*7)}
.hero-line{font-size:clamp(24px,calc(var(--u)*1.9),36px);color:var(--ink-2);text-align:center;font-weight:700}
.hero-line b{color:var(--accent)}
.poses-preview{display:flex;gap:calc(var(--u)*2);justify-content:center}
.poses-preview .pp{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:24px}
.poses-preview svg{height:calc(var(--u)*9);width:auto}
.setup-actions{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.hint-key{font-size:24px;color:var(--ink-2)}
kbd{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:2px 14px;font-family:inherit;font-weight:800}

/* play */
#play{gap:calc(var(--u)*.7)}
.qrow{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);flex:none}
.qbox{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:calc(var(--u)*.2) calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*2.5)}
.qno{white-space:nowrap;font-size:24px;color:var(--ink-2);font-weight:800;align-self:flex-start;margin-top:10px}
.q{font-size:clamp(56px,calc(var(--u)*9),170px);font-weight:900;letter-spacing:.02em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.q .op{color:var(--ink-2);margin:0 .12em}
.q .ans{display:inline-block;min-width:1.1em;text-align:center;color:var(--accent)}
.q.rev .ans{color:var(--good);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.ringwrap{position:relative;width:clamp(110px,calc(var(--u)*12),220px);aspect-ratio:1;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:16}
.ring-fg{fill:none;stroke:var(--primary);stroke-width:16;stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:0}
.ringwrap.low .ring-fg{stroke:var(--hint)}
.ringwrap.done .ring-fg{stroke:var(--good)}
.rnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,calc(var(--u)*6),110px);font-weight:900;color:var(--ink)}
.ringwrap.low .rnum{color:var(--hint)}
.ringwrap.done .rnum{color:var(--good);font-size:clamp(24px,calc(var(--u)*2.6),48px);white-space:nowrap}
.ringwrap.beat{animation:beat .28s ease-out}
.strip{flex:none;min-height:calc(var(--u)*4.6);display:flex;align-items:center;justify-content:center;text-align:center;border-radius:var(--radius);padding:6px 24px;font-size:clamp(26px,calc(var(--u)*2.4),46px);font-weight:900;background:var(--primary-soft);color:var(--primary);transition:background .25s,color .25s}
.strip.rev{background:var(--good-soft);color:var(--good)}
.strip.paused{background:var(--hint-soft);color:#9a6209}
.strip .say{font-size:clamp(32px,calc(var(--u)*3.2),64px);letter-spacing:.08em}
.strip .sub{font-size:clamp(24px,calc(var(--u)*2),38px);color:var(--ink);margin-left:calc(var(--u)*2);animation:pulse 1s ease-in-out infinite;display:inline-block}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.6)}
.ac{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--u)*.8) 12px calc(var(--u)*1);min-height:0;position:relative;transition:transform .4s cubic-bezier(.2,1.4,.4,1),opacity .35s,background .3s,border-color .3s}
.ac .fig{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.ac .fig svg{height:100%;width:auto;max-width:100%}
.ac .act{font-size:clamp(24px,calc(var(--u)*2.2),42px);font-weight:900;color:var(--ink-2)}
.ac .val{font-size:clamp(44px,calc(var(--u)*5),100px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.ac .lt{position:absolute;left:calc(var(--u)*1.2);top:calc(var(--u)*1);width:clamp(52px,calc(var(--u)*5),90px);height:clamp(52px,calc(var(--u)*5),90px);border-radius:50%;color:#fff;font-weight:900;font-size:clamp(30px,calc(var(--u)*3),56px);display:flex;align-items:center;justify-content:center}
.ac[data-k="A"] .lt{background:var(--primary)}
.ac[data-k="B"] .lt{background:var(--accent)}
.ac[data-k="C"] .lt{background:var(--hint)}
.ac.good{background:var(--good-soft);border-color:var(--good);transform:scale(1.05);z-index:2;animation:glow 1.2s ease-in-out infinite}
.ac.good .val{color:var(--good)}
.ac.good .act{color:var(--good)}
.ac.dim{opacity:.38;transform:scale(.95)}
.tick{position:absolute;right:calc(var(--u)*1.2);top:calc(var(--u)*1);width:clamp(52px,calc(var(--u)*5),90px);height:clamp(52px,calc(var(--u)*5),90px);display:none}
.ac.good .tick{display:block;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ctrls{flex:none;display:flex;justify-content:center;gap:16px;margin-top:2px}

/* end */
#end{align-items:center;justify-content:center;gap:calc(var(--u)*1.6);text-align:center}
.end-title{font-size:clamp(40px,calc(var(--u)*5.5),100px);font-weight:900}
.end-title span{color:var(--accent)}
.stats{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;justify-content:center}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:calc(var(--u)*1.2) calc(var(--u)*3);min-width:calc(var(--u)*16)}
.stat b{display:block;font-size:clamp(44px,calc(var(--u)*6),110px);color:var(--primary);line-height:1.1}
.stat span{font-size:24px;color:var(--ink-2);font-weight:700}
.tbl-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(var(--u)*70)}
.tbl-chips i{font-style:normal;background:var(--good-soft);color:var(--good);font-weight:900;border-radius:999px;padding:6px 22px;font-size:clamp(24px,calc(var(--u)*2),36px)}
.tomorrow{font-size:clamp(28px,calc(var(--u)*2.6),50px);font-weight:900;color:var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:12px 40px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:16px;height:26px;border-radius:4px;animation:fall linear infinite}

/* figures */
.fig svg{overflow:visible}
@keyframes armsA{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes armsA2{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-9deg)}}
@keyframes bobUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobDown{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%,55%{transform:translateY(-34px)}}
@keyframes shadowJ{0%,100%{transform:scale(1);opacity:.25}45%,55%{transform:scale(.6);opacity:.12}}
@keyframes chev{0%,100%{transform:translateY(-6px);opacity:.4}50%{transform:translateY(10px);opacity:1}}
@keyframes chevUp{0%,100%{transform:translateY(6px);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
@keyframes swingJ{0%,100%{transform:rotate(18deg)}45%,55%{transform:rotate(-14deg)}}
@keyframes swingJ2{0%,100%{transform:rotate(-18deg)}45%,55%{transform:rotate(14deg)}}
.fa-body{animation:bobUp 1s ease-in-out infinite}
.fa-l{transform-origin:82px 96px;animation:armsA .5s ease-in-out infinite}
.fa-r{transform-origin:118px 96px;animation:armsA2 .5s ease-in-out infinite}
.fb-body{animation:bobDown 1.1s ease-in-out infinite}
.fb-chev{animation:chev 1.1s ease-in-out infinite}
.fc-body{animation:jump .9s cubic-bezier(.4,0,.6,1) infinite}
.fc-shadow{transform-origin:100px 236px;animation:shadowJ .9s cubic-bezier(.4,0,.6,1) infinite}
.fc-l{transform-origin:82px 96px;animation:swingJ .9s ease-in-out infinite}
.fc-r{transform-origin:118px 96px;animation:swingJ2 .9s ease-in-out infinite}
.fa-chev{animation:chevUp 1s ease-in-out infinite}
.paused .fa-body,.paused .fa-l,.paused .fa-r,.paused .fb-body,.paused .fb-chev,.paused .fc-body,.paused .fc-shadow,.paused .fc-l,.paused .fc-r,.paused .fa-chev{animation-play-state:paused}

@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes beat{0%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 rgba(30,158,106,.25),0 0 0 0 rgba(30,158,106,.35)}50%{box-shadow:0 6px 0 rgba(30,158,106,.25),0 0 0 22px rgba(30,158,106,0)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.fa-body,.fa-l,.fa-r,.fb-body,.fb-chev,.fc-body,.fc-shadow,.fc-l,.fc-r,.fa-chev{animation-duration:2s}}

/* ===== 響應式：較矮螢幕（MacBook Air 等） ===== */
#setup{overflow-y:auto;justify-content:flex-start;padding-bottom:76px;scrollbar-width:thin}
#setup>:first-child{margin-top:auto}
#setup>:last-child{margin-bottom:auto}
#end{overflow-y:auto}
#play{padding-bottom:4px}
@media (max-height:860px){
  html,body{font-size:20px}
  .top{min-height:52px;gap:10px}
  .chip{font-size:20px;padding:4px 16px}
  .btn{min-height:48px;padding:0 20px;font-size:20px}
  .btn.big{min-height:60px;font-size:clamp(24px,calc(var(--u)*2.2),36px);padding:0 40px}
  .hero-line{font-size:clamp(20px,calc(var(--u)*1.7),30px)}
  .poses-preview svg{height:calc(var(--u)*6)}
  .poses-preview .pp{font-size:20px}
  .panel{padding:calc(var(--u)*1) calc(var(--u)*2)}
  .panel h3{font-size:clamp(20px,calc(var(--u)*1.6),28px);margin-bottom:6px}
  .panel h3 small{font-size:20px}
  .row{gap:8px}
  .opt{min-width:52px;min-height:52px;padding:0 16px;font-size:clamp(22px,calc(var(--u)*1.8),32px);border-radius:14px}
  #setup{gap:calc(var(--u)*.8)}
  .hint-key{font-size:18px}
  .qno{font-size:20px}
  .q{font-size:clamp(48px,calc(var(--u)*8),150px)}
  .ringwrap{width:clamp(96px,calc(var(--u)*10),200px)}
  .ac .act{font-size:clamp(20px,calc(var(--u)*2),38px)}
  .ac .val{font-size:clamp(36px,calc(var(--u)*4.4),90px)}
  .strip{padding:4px 16px}
  .foot{display:none}
}
@media (max-width:640px){
  #stage{padding-left:10px;padding-right:10px}
  .tools .btn{padding:0 12px}
  .title{font-size:22px}
  .cards{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .brand .title{display:none}
  .qrow{gap:10px}
  .qbox{padding:0 12px;gap:8px}
  .qno{display:none}
  .q{font-size:clamp(36px,11vw,64px)}
  .ringwrap{width:76px}
  .rnum{font-size:34px}
  .ctrls{padding-right:150px}
  .ac{border-width:3px;padding:6px 4px}
  .ac.good{transform:none}
  .strip{font-size:22px}
}
</style>
<script src="audio/no-tts.js"></script>
</head>
<body>
<div id="stage">
  <header class="top">
    <div class="brand"><span class="chip">數學</span><h1 class="title">乘法口訣晨操</h1></div>
    <div class="tools">
      <button class="btn" id="fsBtn" type="button">⛶ 全螢幕</button>
      <button class="btn" id="resetBtn" type="button">↺ 重新開始</button>
    </div>
  </header>

  <!-- 開始畫面 -->
  <section class="screen on" id="setup">
    <p class="hero-line">用<b>身體</b>揀答案！舉高雙手、蹲低、原地跳，全班一齊動起來</p>
    <div class="poses-preview" id="preview"></div>
    <div class="panel">
      <h3>揀乘數表 <small>（可多選）</small></h3>
      <div class="row" id="tblRow"></div>
    </div>
    <div class="panel" style="display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:space-between">
      <div><h3>題數</h3><div class="row" id="cntRow"></div></div>
      <div><h3>每題秒數</h3><div class="row" id="secRow"></div></div>
      <div><h3>聲音</h3><div class="row" id="sndRow"></div></div>
    </div>
    <div class="setup-actions">
      <button class="btn good big" id="startBtn" type="button">▶ 開始晨操</button>
      <span class="hint-key">鍵盤 <kbd>空白鍵</kbd> = 開始 / 暫停 / 下一題</span>
    </div>
  </section>

  <!-- 遊戲畫面 -->
  <section class="screen" id="play">
    <div class="qrow">
      <div class="qbox"><span class="qno" id="qno">第 1 題</span><div class="q" id="q"></div></div>
      <div class="ringwrap" id="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"/></svg>
        <div class="rnum" id="rnum">8</div>
      </div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="cards" id="cards"></div>
    <div class="ctrls">
      <button class="btn" id="pauseBtn" type="button">⏸ 暫停</button>
      <button class="btn primary" id="nextBtn" type="button">⏭ 提早揭曉</button>
    </div>
  </section>

  <!-- 完場畫面 -->
  <section class="screen" id="end">
    <div class="confetti" id="confetti"></div>
    <div class="end-title">晨操完成喇！<span>好犀利</span></div>
    <div class="stats">
      <div class="stat"><b id="eCount">10</b><span>題</span></div>
      <div class="stat"><b id="eTbl">3</b><span>個乘數表</span></div>
    </div>
    <div class="tbl-chips" id="eChips"></div>
    <div class="tomorrow">聽日再嚟挑戰！</div>
    <div class="setup-actions">
      <button class="btn primary big" id="againBtn" type="button">↺ 再玩一次</button>
      <span class="hint-key"><kbd>空白鍵</kbd> = 回到開始畫面</span>
    </div>
  </section>
</div>
<div class="foot">AI 輔助備課工作坊 · 示範教具</div>

<script src="audio/04/voice.js?v=3"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var C = {ink:'#1F2A44', skin:'#FFD9B8', pants:'#3B4A6B', hair:'#4A3426'};

/* ---------- 公仔 SVG ---------- */
function limb(d, col){
  return '<path d="'+d+'" fill="none" stroke="'+C.ink+'" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>'+
         '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>';
}
function head(cx, cy){
  return '<g>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="27" fill="'+C.skin+'" stroke="'+C.ink+'" stroke-width="5"/>'+
    '<path d="M'+(cx-27)+' '+(cy-4)+' Q'+(cx-24)+' '+(cy-34)+' '+cx+' '+(cy-30)+' Q'+(cx+26)+' '+(cy-34)+' '+(cx+27)+' '+(cy-4)+' Q'+(cx+8)+' '+(cy-16)+' '+(cx-10)+' '+(cy-14)+' Q'+(cx-20)+' '+(cy-12)+' '+(cx-27)+' '+(cy-4)+'Z" fill="'+C.hair+'" stroke="'+C.ink+'" stroke-width="4" stroke-linejoin="round"/>'+
    '<circle cx="'+(cx-10)+'" cy="'+(cy+4)+'" r="3.6" fill="'+C.ink+'"/><circle cx="'+(cx+10)+'" cy="'+(cy+4)+'" r="3.6" fill="'+C.ink+'"/>'+
    '<path d="M'+(cx-9)+' '+(cy+14)+' Q'+cx+' '+(cy+24)+' '+(cx+9)+' '+(cy+14)+'" fill="none" stroke="'+C.ink+'" stroke-width="4" stroke-linecap="round"/>'+
    '<circle cx="'+(cx-18)+'" cy="'+(cy+12)+'" r="4.5" fill="#FF9DB5" opacity=".7"/><circle cx="'+(cx+18)+'" cy="'+(cy+12)+'" r="4.5" fill="#FF9DB5" opacity=".7"/>'+
  '</g>';
}
function hand(x,y){ return '<circle cx="'+x+'" cy="'+y+'" r="10" fill="'+C.skin+'" stroke="'+C.ink+'" stroke-width="4.5"/>'; }
function shoe(x,y){ return '<ellipse cx="'+x+'" cy="'+y+'" rx="15" ry="8" fill="#fff" stroke="'+C.ink+'" stroke-width="4.5"/>'; }
function torso(x,y,w,h,col){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="16" fill="'+col+'" stroke="'+C.ink+'" stroke-width="5"/>'; }
function arrow(cls, x, y, up, col){
  var d = up ? 'M-16 10 L0 -6 L16 10' : 'M-16 -10 L0 6 L16 -10';
  return '<g class="'+cls+'" transform="translate('+x+' '+y+')"><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>';
}
function figure(k){
  var s = '<svg viewBox="0 -30 200 290" xmlns="http://www.w3.org/2000/svg" role="img">';
  if(k==='A'){
    var col='#2F6FED';
    s += '<ellipse cx="100" cy="238" rx="50" ry="8" fill="#1F2A44" opacity=".15"/>';
    s += arrow('fa-chev', 100, -12, true, '#2F6FED');
    s += '<g class="fa-body">';
    s += limb('M92 142 L92 222', C.pants)+limb('M108 142 L108 222', C.pants)+shoe(90,230)+shoe(110,230);
    s += '<g class="fa-l">'+limb('M82 98 L54 30', col)+hand(52,24)+'</g>';
    s += '<g class="fa-r">'+limb('M118 98 L146 30', col)+hand(148,24)+'</g>';
    s += torso(78,82,44,64,col)+head(100,50)+'</g>';
  } else if(k==='B'){
    var colB='#E8618C';
    s += '<ellipse cx="100" cy="238" rx="56" ry="8" fill="#1F2A44" opacity=".15"/>';
    s += arrow('fb-chev', 100, 50, false, '#E8618C');
    s += '<g class="fb-body">';
    s += limb('M88 176 L58 200 L68 224', C.pants)+limb('M112 176 L142 200 L132 224', C.pants)+shoe(70,231)+shoe(130,231);
    s += limb('M86 146 L62 196', colB)+limb('M114 146 L138 196', colB)+hand(60,200)+hand(140,200);
    s += torso(80,132,40,50,colB)+head(100,104)+'</g>';
  } else {
    var colC='#E9A23B';
    s += '<ellipse class="fc-shadow" cx="100" cy="236" rx="46" ry="8" fill="#1F2A44" opacity=".25"/>';
    s += '<g class="fc-body">';
    s += limb('M92 144 L72 176 L84 206', C.pants)+limb('M108 144 L128 176 L116 206', C.pants)+shoe(86,212)+shoe(114,212);
    s += '<g class="fc-l">'+limb('M82 98 L52 108', colC)+hand(46,110)+'</g>';
    s += '<g class="fc-r">'+limb('M118 98 L148 108', colC)+hand(154,110)+'</g>';
    s += torso(78,82,44,64,colC)+head(100,50)+'</g>';
  }
  return s+'</svg>';
}
var ACTS = [
  {k:'A', name:'舉高雙手'},
  {k:'B', name:'蹲低'},
  {k:'C', name:'原地跳'}
];
var TICK = '<svg class="tick" viewBox="0 0 60 60"><circle cx="30" cy="30" r="27" fill="#1E9E6A"/><path d="M16 31 L26 41 L45 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- 狀態 ---------- */
var S = {
  phase:'setup',            // setup | count | reveal | end
  tables:[2,3,4], count:10, secs:8, sound:true, voice:true,
  qs:[], idx:0, paused:false,
  elapsed:0, last:0, raf:0, nextBeat:0, beats:[], done:[]
};

/* ---------- 聲音 ---------- */
var AC = null;
function ctx(){
  try{
    if(!AC){ var Ctor = window.AudioContext || window.webkitAudioContext; if(Ctor){ AC = new Ctor(); } }
    if(AC && AC.state === 'suspended' && AC.resume){ AC.resume(); }
  }catch(e){ AC = null; }
  return AC;
}
function drum(strong){
  if(!S.sound){ return; }
  var a = ctx(); if(!a){ return; }
  try{
    var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(strong ? 190 : 150, t);
    o.frequency.exponentialRampToValueAtTime(48, t + .13);
    g.gain.setValueAtTime(strong ? .95 : .8, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + .24);
    if(strong){
      var o2 = a.createOscillator(), g2 = a.createGain();
      o2.type = 'triangle'; o2.frequency.setValueAtTime(1100, t);
      g2.gain.setValueAtTime(.25, t); g2.gain.exponentialRampToValueAtTime(.001, t + .07);
      o2.connect(g2); g2.connect(a.destination); o2.start(t); o2.stop(t + .09);
    }
  }catch(e){}
}
function ding(){
  if(!S.sound){ return; }
  var a = ctx(); if(!a){ return; }
  try{
    var t = a.currentTime;
    [880, 1318.5].forEach(function(f, i){
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i*.12);
      g.gain.exponentialRampToValueAtTime(.35, t + i*.12 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + i*.12 + .7);
      o.connect(g); g.connect(a.destination);
      o.start(t + i*.12); o.stop(t + i*.12 + .75);
    });
  }catch(e){}
}

/* ---------- TTS ---------- */
var VOICES = [];
function loadVoices(){ try{ VOICES = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }catch(e){ VOICES = []; } }
function pickVoice(lang){
  var l = lang.toLowerCase(), i, v;
  for(i=0;i<VOICES.length;i++){ v = VOICES[i]; if(v.lang && v.lang.toLowerCase().replace('_','-') === l){ return v; } }
  for(i=0;i<VOICES.length;i++){ v = VOICES[i]; if(v.lang && v.lang.toLowerCase().replace('_','-').indexOf(l) === 0){ return v; } }
  return null;
}
try{
  if(window.speechSynthesis){
    loadVoices();
    if(window.speechSynthesis.addEventListener){ window.speechSynthesis.addEventListener('voiceschanged', loadVoices); }
    else { window.speechSynthesis.onvoiceschanged = loadVoices; }
  }
}catch(e){}
function ttsFallback(text, rate, done){
  var fired = false;
  function fin(){ if(!fired){ fired = true; if(done){ done(); } } }
  if(!S.voice || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined'){ setTimeout(fin, 1600); return; }
  try{
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK'; u.rate = rate || .85;
    var v = pickVoice('zh-HK'); if(v){ u.voice = v; }
    u.onend = fin; u.onerror = fin;
    window.speechSynthesis.speak(u);
    setTimeout(fin, 4500);
  }catch(e){ setTimeout(fin, 1600); }
}

var VOICE = (function(){
  var cur = null;
  function norm(t){ return String(t).replace(/\s+/g,''); }
  function lookup(t){ return (window.VOICE_LINES || {})[norm(t)]; }
  function stop(){ if(cur){ cur.onended = null; try{ cur.pause(); }catch(e){} cur = null; } try{ if(window.speechSynthesis){ window.speechSynthesis.cancel(); } }catch(e){} }
  function speak(text, opt){
    opt = opt || {}; stop();
    var src = lookup(text);
    if(src){
      try{
        var a = new Audio(src); cur = a;
        a.playbackRate = opt.rate || 1; a.preservesPitch = true;
        a.onended = function(){ if(cur === a){ cur = null; } if(opt.onend){ opt.onend(); } };
        a.onerror = function(){ cur = null; ttsFallback(text, opt.rate, opt.onend); };
        var p = a.play();
        if(p && p.catch){ p.catch(function(){ cur = null; ttsFallback(text, opt.rate, opt.onend); }); }
        return;
      }catch(e){ cur = null; }
    }
    ttsFallback(text, opt.rate, opt.onend);
  }
  return {speak:speak, stop:stop};
})();
function speak(text, rate, done){
  if(!S.voice){ setTimeout(function(){ if(done){ done(); } }, 1600); return; }
  VOICE.speak(text, {rate:rate, onend:done});
}
function stopSpeak(){ VOICE.stop(); }

/* ---------- 口訣 ---------- */
var CN = ['零','一','二','三','四','五','六','七','八','九'];
function numCN(n){
  if(n === 10){ return '一十'; }
  if(n < 10){ return CN[n]; }
  var t = Math.floor(n/10), u = n % 10;
  if(t === 1){ return '十' + (u ? CN[u] : ''); }
  return CN[t] + '十' + (u ? CN[u] : '');
}
function kouJue(a, b){
  var x = Math.min(a,b), y = Math.max(a,b), p = a*b;
  return CN[x] + CN[y] + (p < 10 ? '得' + CN[p] : numCN(p));
}

/* ---------- 出題 ---------- */
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
function distractors(a, b){
  var p = a*b, cand = [];
  if(a-1 >= 2){ cand.push((a-1)*b); }
  cand.push((a+1)*b);
  if(b-1 >= 2){ cand.push(a*(b-1)); }
  cand.push(a*(b+1));
  cand = shuffle(cand.filter(function(v, i, arr){ return v !== p && v > 0 && arr.indexOf(v) === i; }));
  var out = cand.slice(0,2);
  var extra = [p+10, p-10, p+a, p-b, p+b, p+2, p-2, p+1, p-1];
  for(var i=0; out.length<2 && i<extra.length; i++){
    var v = extra[i];
    if(v > 0 && v !== p && out.indexOf(v) < 0){ out.push(v); }
  }
  return out;
}
function buildQuestions(){
  var pool = [], qs = [], lastKey = '';
  while(qs.length < S.count){
    pool = [];
    S.tables.forEach(function(t){ for(var b=2;b<=9;b++){ pool.push([t,b]); } });
    shuffle(pool);
    for(var i=0;i<pool.length && qs.length < S.count;i++){
      var pr = pool[i], key = pr[0]+'x'+pr[1];
      if(key === lastKey && pool.length > 1){ continue; }
      lastKey = key;
      var a = pr[0], b = pr[1];
      if(Math.random() < .5){ var tmp = a; a = b; b = tmp; }
      var ds = distractors(a, b);
      var opts = shuffle([a*b, ds[0], ds[1]]);
      qs.push({a:a, b:b, p:a*b, opts:opts, ci:opts.indexOf(a*b)});
    }
  }
  return qs;
}

/* ---------- 畫面 ---------- */
function show(name){
  ['setup','play','end'].forEach(function(n){ var e = $(n); if(e){ e.classList.toggle('on', n === name); } });
}
function setStrip(html, cls){
  var s = $('strip'); if(!s){ return; }
  s.className = 'strip' + (cls ? ' ' + cls : '');
  s.innerHTML = html;
}
function renderQ(rev){
  var q = S.qs[S.idx]; if(!q){ return; }
  var el = $('q'); if(!el){ return; }
  el.className = 'q' + (rev ? ' rev' : '');
  el.innerHTML = '<span>'+q.a+'</span><span class="op">×</span><span>'+q.b+'</span><span class="op">=</span><span class="ans">'+(rev ? q.p : '?')+'</span>';
  var n = $('qno'); if(n){ n.textContent = '第 ' + (S.idx+1) + ' / ' + S.qs.length + ' 題'; }
}
function renderCards(){
  var q = S.qs[S.idx], box = $('cards'); if(!q || !box){ return; }
  var h = '';
  ACTS.forEach(function(a, i){
    h += '<div class="ac" data-k="'+a.k+'" data-i="'+i+'"><div class="lt">'+a.k+'</div>'+TICK+
         '<div class="fig">'+figure(a.k)+'</div><div class="act">'+a.name+'</div><div class="val">'+q.opts[i]+'</div></div>';
  });
  box.innerHTML = h;
}
function setRing(frac, secLeft){
  var fg = $('ringFg'), rn = $('rnum'), rg = $('ring');
  if(fg){ fg.style.strokeDashoffset = String(553 * (1 - Math.max(0, Math.min(1, frac)))); }
  if(rn){ rn.textContent = String(secLeft); }
  if(rg){ rg.classList.toggle('low', secLeft <= 3 && secLeft > 0); }
}
function pulseRing(){
  var rg = $('ring'); if(!rg){ return; }
  rg.classList.remove('beat'); void rg.offsetWidth; rg.classList.add('beat');
}

/* ---------- 流程 ---------- */
function startGame(){
  if(!S.tables.length){ return; }
  ctx();
  stopSpeak();
  S.qs = buildQuestions(); S.idx = 0;
  show('play');
  startQuestion();
}
function startQuestion(){
  cancelAnimationFrame(S.raf);
  stopSpeak();
  S.phase = 'count'; S.paused = false; S.elapsed = 0; S.last = performance.now();
  S.beats = [];
  for(var i=0;i<S.secs;i++){
    S.beats.push({t:i, strong:(S.secs - i) <= 3});
    if(S.secs - i <= 3){ S.beats.push({t:i+.5, strong:false}); }
  }
  S.nextBeat = 0;
  renderQ(false); renderCards();
  var rg = $('ring'); if(rg){ rg.className = 'ringwrap'; }
  $('cards').classList.remove('paused');
  setStrip('跟住拍子，用身體做動作揀答案！');
  var pb = $('pauseBtn'), nb = $('nextBtn');
  if(pb){ pb.textContent = '⏸ 暫停'; pb.style.display = ''; }
  if(nb){ nb.textContent = '⏭ 提早揭曉'; nb.className = 'btn primary'; }
  setRing(1, S.secs);
  S.raf = requestAnimationFrame(loop);
}
function loop(now){
  if(S.phase !== 'count'){ return; }
  var dt = (now - S.last) / 1000; S.last = now;
  if(!S.paused){
    if(dt > .25){ dt = .25; }
    S.elapsed += dt;
    while(S.nextBeat < S.beats.length && S.elapsed >= S.beats[S.nextBeat].t){
      drum(S.beats[S.nextBeat].strong); pulseRing(); S.nextBeat++;
    }
    var left = S.secs - S.elapsed;
    if(left <= 0){ setRing(0, 0); reveal(); return; }
    setRing(left / S.secs, Math.ceil(left));
  }
  S.raf = requestAnimationFrame(loop);
}
function togglePause(){
  if(S.phase !== 'count'){ return; }
  S.paused = !S.paused;
  S.last = performance.now();
  var pb = $('pauseBtn'), cards = $('cards');
  if(pb){ pb.textContent = S.paused ? '▶ 繼續' : '⏸ 暫停'; }
  if(cards){ cards.classList.toggle('paused', S.paused); }
  if(S.paused){ setStrip('暫停中　按「繼續」或空白鍵', 'paused'); }
  else { setStrip('跟住拍子，用身體做動作揀答案！'); }
}
function reveal(){
  if(S.phase !== 'count'){ return; }
  cancelAnimationFrame(S.raf);
  S.phase = 'reveal'; S.paused = false;
  var q = S.qs[S.idx];
  S.done.push(q.a + 'x' + q.b);
  $('cards').classList.remove('paused');
  renderQ(true);
  var cards = $('cards').children;
  for(var i=0;i<cards.length;i++){ cards[i].classList.add(i === q.ci ? 'good' : 'dim'); }
  var rg = $('ring'); if(rg){ rg.classList.remove('low','beat'); rg.classList.add('done'); }
  var rn = $('rnum'); if(rn){ rn.textContent = '時間到'; }
  ding();
  var kj = kouJue(q.a, q.b);
  setStrip('<span class="say">'+kj+'！</span>', 'rev');
  var last = (S.idx >= S.qs.length - 1);
  var pb = $('pauseBtn'), nb = $('nextBtn');
  if(pb){ pb.style.display = 'none'; }
  if(nb){ nb.textContent = last ? '🏁 完成' : '下一題 ▶'; nb.className = 'btn good'; }
  var myIdx = S.idx;
  setTimeout(function(){
    if(S.phase !== 'reveal' || S.idx !== myIdx){ return; }
    speak(kj, .8, function(){
      if(S.phase !== 'reveal' || S.idx !== myIdx){ return; }
      setStrip('<span class="say">'+kj+'！</span><span class="sub">👏 全班一齊讀！</span>', 'rev');
      setTimeout(function(){
        if(S.phase !== 'reveal' || S.idx !== myIdx){ return; }
        speak(kj, .7);
      }, 500);
    });
  }, 450);
}
function next(){
  if(S.phase === 'count'){ reveal(); return; }
  if(S.phase !== 'reveal'){ return; }
  if(S.idx >= S.qs.length - 1){ finish(); return; }
  S.idx++; startQuestion();
}
function finish(){
  cancelAnimationFrame(S.raf); stopSpeak();
  S.phase = 'end';
  show('end');
  $('eCount').textContent = String(S.qs.length);
  $('eTbl').textContent = String(S.tables.length);
  var chips = '';
  S.tables.forEach(function(t){ chips += '<i>' + t + ' 的乘數表</i>'; });
  $('eChips').innerHTML = chips;
  ding();
  setTimeout(function(){ if(S.phase === 'end'){ speak('做得好呀！聽日再嚟挑戰啦！', .9); } }, 500);
  var cf = $('confetti'), h = '', cols = ['#2F6FED','#E8618C','#E9A23B','#1E9E6A'];
  for(var i=0;i<36;i++){
    h += '<i style="left:'+(Math.random()*100)+'%;background:'+cols[i%4]+';animation-duration:'+(3+Math.random()*3)+'s;animation-delay:'+(Math.random()*2.5)+'s"></i>';
  }
  if(cf){ cf.innerHTML = h; }
}
function toSetup(){
  cancelAnimationFrame(S.raf); stopSpeak();
  S.phase = 'setup'; S.paused = false;
  show('setup');
}

/* ---------- 設定畫面 ---------- */
function buildSetup(){
  var pv = $('preview'), h = '';
  ACTS.forEach(function(a){ h += '<div class="pp">'+figure(a.k)+'<span>'+a.k+'　'+a.name+'</span></div>'; });
  if(pv){ pv.innerHTML = h; }
  var tr = $('tblRow'); h = '';
  for(var t=2;t<=9;t++){ h += '<button type="button" class="opt tbl" data-t="'+t+'">'+t+'</button>'; }
  h += '<button type="button" class="opt" data-all="1" style="font-size:24px">全選</button>';
  if(tr){ tr.innerHTML = h; }
  fillOpts('cntRow', [5,10,15,20], 'count', '題');
  fillOpts('secRow', [5,8,10], 'secs', '秒');
  var sn = $('sndRow');
  if(sn){
    sn.innerHTML = '<button type="button" class="opt" data-s="sound" style="font-size:24px">🥁 鼓聲</button><button type="button" class="opt" data-s="voice" style="font-size:24px">🗣 讀口訣</button>';
  }
  syncSetup();
}
function fillOpts(id, arr, key, unit){
  var r = $(id), h = ''; if(!r){ return; }
  arr.forEach(function(v){ h += '<button type="button" class="opt" data-k="'+key+'" data-v="'+v+'">'+v+' '+unit+'</button>'; });
  r.innerHTML = h;
}
function syncSetup(){
  var all = document.querySelectorAll('#tblRow .opt');
  for(var i=0;i<all.length;i++){
    var b = all[i];
    if(b.getAttribute('data-all')){ b.classList.toggle('on', S.tables.length === 8); b.textContent = S.tables.length === 8 ? '全部取消' : '全選'; }
    else { b.classList.toggle('on', S.tables.indexOf(parseInt(b.getAttribute('data-t'),10)) >= 0); }
  }
  ['cntRow','secRow'].forEach(function(id){
    var bs = document.querySelectorAll('#'+id+' .opt');
    for(var j=0;j<bs.length;j++){
      var k = bs[j].getAttribute('data-k'), v = parseInt(bs[j].getAttribute('data-v'),10);
      bs[j].classList.toggle('on', S[k] === v);
    }
  });
  var ss = document.querySelectorAll('#sndRow .opt');
  for(var m=0;m<ss.length;m++){ ss[m].classList.toggle('on', !!S[ss[m].getAttribute('data-s')]); }
  var sb = $('startBtn'); if(sb){ sb.disabled = !S.tables.length; }
}
function onSetupClick(e){
  var b = e.target.closest ? e.target.closest('.opt') : null; if(!b){ return; }
  if(b.getAttribute('data-all')){
    S.tables = (S.tables.length === 8) ? [] : [2,3,4,5,6,7,8,9];
  } else if(b.getAttribute('data-t')){
    var t = parseInt(b.getAttribute('data-t'),10), i = S.tables.indexOf(t);
    if(i >= 0){ S.tables.splice(i,1); } else { S.tables.push(t); S.tables.sort(function(x,y){ return x-y; }); }
  } else if(b.getAttribute('data-k')){
    S[b.getAttribute('data-k')] = parseInt(b.getAttribute('data-v'),10);
  } else if(b.getAttribute('data-s')){
    var key = b.getAttribute('data-s'); S[key] = !S[key];
    if(key === 'sound' && S.sound){ ctx(); drum(true); }
  }
  syncSetup();
}

/* ---------- 全螢幕 / 事件 ---------- */
function toggleFs(){
  try{
    var d = document;
    if(d.fullscreenElement || d.webkitFullscreenElement){
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } else {
      var el = d.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
      if(f){ var r = f.call(el); if(r && r.catch){ r.catch(function(){}); } }
    }
  }catch(e){}
}
function on(id, ev, fn){ var e = $(id); if(e){ e.addEventListener(ev, fn); } }
on('fsBtn','click', toggleFs);
on('resetBtn','click', toSetup);
on('startBtn','click', startGame);
on('againBtn','click', toSetup);
on('pauseBtn','click', togglePause);
on('nextBtn','click', next);
on('setup','click', onSetupClick);
document.addEventListener('keydown', function(e){
  if(e.code !== 'Space' && e.key !== ' '){ return; }
  e.preventDefault();
  if(e.repeat){ return; }
  try{ if(document.activeElement && document.activeElement.blur){ document.activeElement.blur(); } }catch(x){}
  if(S.phase === 'setup'){ if(S.tables.length){ startGame(); } }
  else if(S.phase === 'count'){ togglePause(); }
  else if(S.phase === 'reveal'){ next(); }
  else if(S.phase === 'end'){ toSetup(); }
});
document.addEventListener('keyup', function(e){ if(e.code === 'Space' || e.key === ' '){ e.preventDefault(); } });

buildSetup();
})();
</script>
