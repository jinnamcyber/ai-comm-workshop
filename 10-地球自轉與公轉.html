<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地球自轉與公轉</title>
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#1F2A44; --ink-2:#5B6478; --line:#E8DFCF;
  --primary:#2F6FED; --primary-soft:#E3ECFF;
  --good:#1E9E6A; --good-soft:#DDF5EA;
  --hint:#E9A23B; --hint-soft:#FFF1D6;
  --accent:#E8618C; --accent-soft:#FDE4EC;
  --radius:22px; --shadow:0 6px 0 rgba(31,42,68,.08), 0 14px 30px rgba(31,42,68,.08);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:clamp(20px,1.3vw,26px);line-height:1.35;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.app{min-height:100vh;display:flex;flex-direction:column;padding:clamp(8px,.9vw,18px);gap:clamp(8px,.8vw,14px)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex:0 0 auto;flex-wrap:wrap}
.chip{background:var(--primary);color:#fff;border-radius:999px;padding:.15em .85em;font-weight:800;letter-spacing:.05em}
h1{margin:0;font-size:1.4em;font-weight:800}
.spacer{flex:1}
.btn{min-height:64px;border:0;border-radius:18px;background:var(--primary);color:#fff;font-size:1em;font-weight:800;padding:0 1.1em;box-shadow:0 6px 0 rgba(31,42,68,.2);cursor:pointer;touch-action:manipulation;transition:transform .08s, box-shadow .08s, background .15s;display:inline-flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,42,68,.2)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 rgba(31,42,68,.08)}
.btn.toggle{background:#fff;color:var(--ink-2);border:3px solid var(--line);box-shadow:0 6px 0 rgba(31,42,68,.08)}
.btn.toggle[aria-pressed="true"]{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 6px 0 rgba(30,158,106,.35)}
.btn.warn{background:var(--hint);color:#3a2a05;box-shadow:0 6px 0 rgba(150,95,10,.3)}
.btn.warn[aria-pressed="true"]{background:var(--hint);}
.btn.pink{background:var(--accent);box-shadow:0 6px 0 rgba(150,40,80,.3)}
.btn:focus-visible{outline:4px solid var(--primary-soft);outline-offset:2px}

/* layout */
.grid{flex:1 1 0;min-height:560px;grid-template-rows:minmax(0,1fr);display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,30vw,600px);gap:clamp(8px,.8vw,14px)}
.left,.right{display:flex;flex-direction:column;gap:clamp(8px,.8vw,14px);min-width:0;min-height:0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(10px,.9vw,16px)}
.stage{flex:1;min-height:280px;position:relative;padding:0;overflow:hidden;background:#12204a}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage .tip{position:absolute;right:14px;bottom:12px;font-size:.78em;color:#cfe0ff;background:rgba(10,18,50,.55);padding:.2em .7em;border-radius:12px;pointer-events:none}

/* controls */
.controls{display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.row-btns{display:flex;gap:12px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 110px;padding:0 .6em}
.sliders{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(12px,1.6vw,28px)}
.sl label,.sl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800;margin-bottom:2px}
.sl .lab span.v{color:var(--primary);font-weight:800}
.sl .sub{display:flex;justify-content:space-between;color:var(--ink-2);font-size:.72em;margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:64px;background:transparent;margin:0;touch-action:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:99px;background:linear-gradient(90deg,var(--primary-soft),#c9dcff);box-shadow:inset 0 2px 3px rgba(31,42,68,.15)}
input[type=range]::-moz-range-track{height:16px;border-radius:99px;background:linear-gradient(90deg,var(--primary-soft),#c9dcff)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;border-radius:50%;background:var(--primary);border:5px solid #fff;margin-top:-15px;box-shadow:0 4px 0 rgba(31,42,68,.25)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--primary);border:5px solid #fff;box-shadow:0 4px 0 rgba(31,42,68,.25)}
input[type=range]:focus-visible{outline:3px solid var(--primary-soft);border-radius:12px}
.months{display:flex;margin-top:-8px;color:var(--ink-2);font-size:.7em}
.months span{text-align:center;overflow:hidden;white-space:nowrap}

/* right */
.zoom{flex:0 0 auto}
.card h2{margin:0 0 6px;font-size:1em;font-weight:800;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.zoomwrap{position:relative;height:clamp(170px,25vh,340px);border-radius:16px;overflow:hidden;background:#0d1838}
.zoomwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.status{display:inline-block;border-radius:999px;padding:.05em .75em;font-weight:800;font-size:.85em}
.st-day{background:var(--hint-soft);color:#8a5a00}
.st-twi{background:var(--accent-soft);color:#a3274f}
.st-night{background:#2a3563;color:#dfe7ff}
.clock{margin:8px 0 2px;font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.clock .t{color:var(--primary)}
.hbar{position:relative;height:26px;border-radius:99px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);background:#2a3563;overflow:visible}
.hbar .mk{position:absolute;top:-9px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:16px solid var(--accent);transform:translateX(-50%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.hticks{display:flex;justify-content:space-between;color:var(--ink-2);font-size:.68em;margin-top:2px}
.facts{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.fact{background:var(--primary-soft);border-radius:14px;padding:.3em .7em;font-weight:800;font-size:.86em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fact small{font-size:.8em;color:var(--ink-2);font-weight:700}
.ybar{position:relative;flex:0 0 22%;max-width:22%;height:14px;border-radius:99px;background:#fff;overflow:hidden}
.ybar i{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:99px}

.info{flex:1 1 0;min-height:110px;overflow:auto}
.dateline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.big{font-size:1.5em;font-weight:900}
.tag{border-radius:999px;padding:.05em .7em;font-weight:800;font-size:.85em;color:#fff}
.tg-0{background:#3aa66b}.tg-1{background:#e2603a}.tg-2{background:#d28a1a}.tg-3{background:#3d78d6}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:#faf5ea;border-radius:14px;padding:.3em .7em}
.kv dt{font-size:.72em;color:var(--ink-2);font-weight:700}
.kv dd{margin:0;font-weight:800;font-size:.92em}
.kv{margin:0}
#explain{margin:8px 0 0;font-size:.88em;color:var(--ink);background:var(--hint-soft);border-radius:14px;padding:.4em .8em}

footer{flex:0 0 auto;text-align:right;color:var(--ink-2);font-size:14px;padding:0 4px}

/* quiz overlay */
.overlay{position:fixed;inset:0;background:rgba(18,26,56,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.qbox{background:var(--bg);border-radius:28px;width:min(1100px,96vw);max-height:96vh;overflow:auto;padding:clamp(14px,1.6vw,28px);box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.qtabs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qtabs .btn{flex:0 0 auto;min-width:130px}
.qtabs .btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.flip{perspective:1400px;height:clamp(260px,38vh,400px);cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.fl .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;padding:clamp(16px,2vw,36px);display:flex;flex-direction:column;justify-content:center;gap:12px;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:var(--shadow)}
.face.f{background:var(--primary);color:#fff}
.face.b{background:#fff;color:var(--ink);transform:rotateY(180deg);border:4px solid var(--good)}
.face .qn{font-size:.8em;opacity:.85;font-weight:800}
.face .qt{font-size:1.45em;font-weight:900;line-height:1.4}
.face .at{font-size:1.02em;line-height:1.55}
.face .flipHint{font-size:.78em;opacity:.8}
.qact{display:flex;gap:12px;flex-wrap:wrap}
.qact .btn{flex:1 1 200px}

.toast{position:fixed;left:50%;bottom:54px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:.5em 1.1em;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .grid{grid-template-columns:1fr}
  .sliders{grid-template-columns:1fr}
  .stage{min-height:420px;flex:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="chip">常識</span>
    <h1>地球自轉與公轉</h1>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnFs" type="button">⛶ 全螢幕</button>
    <button class="btn ghost" id="btnReset" type="button">↺ 重新開始</button>
  </header>

  <main class="grid">
    <section class="left">
      <div class="card stage" id="stage">
        <canvas id="orbit" aria-label="地球繞太陽公轉示意圖"></canvas>
        <div class="tip">拖動地球，或點選節氣標籤，就可以改變日期</div>
      </div>

      <div class="card controls">
        <div class="row-btns">
          <button class="btn" id="btnPlay" type="button">⏸ 暫停</button>
          <button class="btn toggle" id="btnSpin" type="button" aria-pressed="true">自轉：開</button>
          <button class="btn toggle" id="btnOrbit" type="button" aria-pressed="true">公轉：開</button>
          <button class="btn warn" id="btnTilt" type="button" aria-pressed="true">地軸：傾斜</button>
          <button class="btn pink" id="btnQ" type="button">❓ 提問卡</button>
        </div>
        <div class="sliders">
          <div class="sl">
            <div class="lab">速度<span class="v" id="speedTxt"></span></div>
            <input type="range" id="speed" min="0" max="100" step="1" value="70" aria-label="速度">
            <div class="sub"><span>慢：看一日</span><span>快：看一年</span></div>
          </div>
          <div class="sl">
            <div class="lab">日期<span class="v" id="dateTxt"></span></div>
            <input type="range" id="date" min="0" max="364" step="1" value="0" aria-label="日期">
            <div class="months" id="months"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="card zoom">
        <h2>放大看：地球自轉 <span class="status st-day" id="stat">白天</span></h2>
        <div class="zoomwrap"><canvas id="zoom" aria-label="地球近鏡"></canvas></div>
        <div class="clock"><span>澳門時間（太陽時）</span><span class="t" id="clockTxt">--</span></div>
        <div class="hbar" id="hbar"><div class="mk" id="hmk"></div></div>
        <div class="hticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24 時</span></div>
        <div class="facts">
          <div class="fact"><span>一日 = 自轉一圈 ≈ 24 小時</span></div>
          <div class="fact"><span>一年 = 公轉一圈 ≈ 365 天</span><div class="ybar"><i id="ybarI"></i></div></div>
        </div>
      </div>

      <div class="card info">
        <div class="dateline"><span class="big" id="dateBig"></span><span class="tag" id="tagS"></span></div>
        <dl class="kv">
          <div><dt>澳門大約是</dt><dd id="kSeason"></dd></div>
          <div><dt>日夜長短</dt><dd id="kDay"></dd></div>
          <div><dt>太陽直射點</dt><dd id="kDecl"></dd></div>
          <div><dt>正午太陽高度</dt><dd id="kAlt"></dd></div>
        </dl>
        <p id="explain"></p>
      </div>
    </aside>
  </main>
  <footer>AI 輔助備課工作坊 · 示範教具</footer>
</div>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-label="教學提問卡">
  <div class="qbox">
    <div class="qtabs" id="qtabs"></div>
    <div class="flip" id="flip" tabindex="0">
      <div class="in">
        <div class="face f"><div class="qn" id="qn"></div><div class="qt" id="qt"></div><div class="flipHint">點一下卡片，翻轉看答案</div></div>
        <div class="face b"><div class="qn" style="color:var(--good)">參考答案</div><div class="at" id="qa"></div></div>
      </div>
    </div>
    <div class="qact">
      <button class="btn" id="qFlip" type="button">🔄 翻面</button>
      <button class="btn warn" id="qGo" type="button"></button>
      <button class="btn ghost" id="qClose" type="button">✕ 關閉</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

    g.lineCap='round';g.lineWidth=5;g.strokeStyle='#FFE08A';
    g.beginPath();g.moveTo(E.x,E.y);g.lineTo(E.x-axX*len,E.y-axY*len);g.stroke();
    // 地球
    var s=sunVec();var sv=[-ex,-ey,0]; sv=[s[0],s[1],s[2]];
    var Cb=[cosEl,0,sinEl];var dc=dot(sv,Cb);
    var se=norm([sv[0]-0.8*dc*Cb[0],sv[1]-0.8*dc*Cb[1],sv[2]-0.8*dc*Cb[2]]);
    var q=Math.min(oc.dpr,2)*1.0;
    renderEarthOrbit(g,E.x,E.y,Re,q,{R:[0,1,0],U:[-sinEl,0,cosEl],C:[cosEl,0,sinEl]},se,state.eps,state.psi,null);
    // 輪廓
    g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(E.x,E.y,Re,0,TAU);g.stroke();
    // 地軸北端
    g.strokeStyle='#FFE08A';g.lineWidth=5;g.beginPath();g.moveTo(E.x,E.y);g.lineTo(E.x+axX*len,E.y+axY*len);g.stroke();
    g.fillStyle='#FFE08A';g.beginPath();g.arc(E.x+axX*len,E.y+axY*len,6,0,TAU);g.fill();
    g.font='800 '+(fs*0.85)+'px '+FONT;g.textAlign='center';g.fillStyle='#FFE08A';
    g.strokeStyle='rgba(10,18,50,.85)';g.lineWidth=5;g.lineJoin='round';g.strokeText('北',E.x+axX*(len+fs*0.8),E.y+axY*(len+fs*0.8));g.fillText('北',E.x+axX*(len+fs*0.8),E.y+axY*(len+fs*0.8));
    // 傾角弧線
    if(state.eps>1){
      var a0=-Math.PI/2, a1=Math.atan2(axY,axX);
      g.lineWidth=3;g.strokeStyle='#FFB02E';g.beginPath();g.arc(E.x,E.y,len*0.78,a0,a1,false);g.stroke();
      g.font='800 '+(fs*0.82)+'px '+FONT;g.fillStyle='#FFB02E';g.textAlign='left';
      g.textAlign='right';g.strokeStyle='rgba(10,18,50,.85)';g.lineWidth=5;g.lineJoin='round';g.strokeText(state.eps.toFixed(1)+'°',E.x-8,E.y-len*0.95);g.fillText(state.eps.toFixed(1)+'°',E.x-8,E.y-len*0.95);
    }
    // 澳門點
    var m=macauWorld(state.eps,state.psi);
    var dep=m[0]*cosEl+m[2]*sinEl;
    if(dep>0.02){
      var mx=E.x+(m[1])*Re, my=E.y-(-m[0]*sinEl+m[2]*cosEl)*Re;
      g.fillStyle='#E8618C';g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(mx,my,Math.max(5,Re*0.14),0,TAU);g.fill();g.stroke();
    }
  }
  // 順序
  orbitArc(false,0.35);
  // 節氣標籤（喺地球之下）
  var Ls=[0,90,180,270]; // 地球日心黃經：秋分、冬至、春分、夏至
  var map=[2,3,0,1];     // 對應 KEY index
  for(var j=0;j<4;j++){
    var th=Ls[j]*D2R,x=Math.cos(th),y=Math.sin(th);
    var px=cx+R*y,py=cy+R*sinEl*x;
    var side=Math.abs(x)<0.5;
    var py2=side?py+Re*2.0+ph/2+6:py;
    if(!side)px=px+Re*1.7+pw/2+10;
    var ox=side?px:px-(Re*1.7+pw/2+10);
    var kidx=map[j];
    var diff=Math.abs(wrapPi(L-th))/D2R;
    var active=diff<5;
    rr(g,px-pw/2,py2-ph/2,pw,ph,16);
    g.fillStyle=active?'#FFF1D6':'rgba(40,56,110,.85)';g.fill();
    g.lineWidth=3;g.strokeStyle=active?'#E9A23B':'rgba(255,255,255,.55)';g.stroke();
    g.textAlign='center';
    g.fillStyle=active?'#7a4b00':'#fff';g.font='900 '+fs+'px '+FONT;g.fillText(KEY_NAMES[kidx],px,py2-fs*0.55);
    g.font='700 '+(fs*0.82)+'px '+FONT;g.fillStyle=active?'#8a5a00':'#cfe0ff';g.fillText(KEY_DATES[kidx],px,py2+fs*0.62);
    // 軌道上小點
    g.fillStyle=active?'#FFB02E':'rgba(255,255,255,.8)';g.beginPath();g.arc(ox,py,4,0,TAU);g.fill();
    hits.push({x:px-pw/2-6,y:py2-ph/2-6,w:pw+12,h:ph+12,d:ANCH_D[kidx]});
  }
  if(!earthFront){cone();drawEarth();}
  drawSun();
  orbitArc(true,0.6);
  arrowAt(40);arrowAt(220);
  if(earthFront){cone();drawEarth();}

  // 圖例
  g.textAlign='left';g.font='700 '+(fs*0.8)+'px '+FONT;
  var ly=H-fs*1.9;
  g.fillStyle='#E8618C';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(18,ly,8,0,TAU);g.fill();g.stroke();
  g.fillStyle='#e6eeff';g.fillText('澳門（北緯約 22°）',34,ly);
  g.fillText('白箭咀：公轉方向（由北極上方看是逆時針）',18,ly+fs*1.0);
  g.fillStyle='rgba(255,255,255,.0)';
}

/* ---------- 近鏡畫面 ---------- */
function zoomBasis(s){
  var h=[s[1],-s[0],0], A=50*D2R;
  return {R:s,U:[-h[0]*Math.sin(A),-h[1]*Math.sin(A),Math.cos(A)],C:[h[0]*Math.cos(A),h[1]*Math.cos(A),Math.sin(A)]};
}
function drawZoom(t){
  var g=zc.g,W=zc.w,H=zc.h; if(!g||!W) return;
  var bgG=g.createLinearGradient(0,0,W,0);bgG.addColorStop(0,'#0a1230');bgG.addColorStop(1,'#1a2a5c');
  g.fillStyle=bgG;g.fillRect(0,0,W,H);
  for(var i=0;i<40;i++){var st=stars[i];g.globalAlpha=0.5;g.fillStyle='#fff';g.beginPath();g.arc(st[0]*W,st[1]*H,st[2]*0.7,0,TAU);g.fill();}
  g.globalAlpha=1;
  var fs=Math.max(16,Math.min(24,W/22));
  var s=sunVec(), B=zoomBasis(s);
  var rad=Math.min(H*0.33,W*0.27), cx=W*0.45, cy=H*0.56;
  // 太陽光箭咀
  g.strokeStyle='rgba(255,214,90,.9)';g.fillStyle='rgba(255,214,90,.9)';g.lineWidth=4;g.lineCap='round';
  for(var a=-1;a<=1;a++){
    var y=cy+a*rad*0.55, x0=W-8, x1=cx+rad*1.28;
    g.beginPath();g.moveTo(x0,y);g.lineTo(x1+8,y);g.stroke();
    g.beginPath();g.moveTo(x1,y);g.lineTo(x1+14,y-8);g.lineTo(x1+14,y+8);g.closePath();g.fill();
  }
  g.font='800 '+fs+'px '+FONT;g.textAlign='right';g.textBaseline='middle';g.fillStyle='#FFD43B';
  g.fillText('☀ 太陽光',W-10,cy-rad*1.02>fs?cy-rad*1.02:fs);
  var q=Math.min(zc.dpr,1.5);
  var maxPx=440;if(rad*2*q>maxPx)q=maxPx/(rad*2);
  renderEarthZoom(g,cx,cy,rad,q,B,s,state.eps,state.psi,{parallel:true});
  g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.3)';g.beginPath();g.arc(cx,cy,rad,0,TAU);g.stroke();
  // 地軸
  var e=state.eps*D2R;
  var axis=[0,Math.sin(e),Math.cos(e)];
  var vx=dot(axis,B.R), vy=-dot(axis,B.U); // 畫面 y 向下
  var vm=Math.sqrt(vx*vx+vy*vy);
  g.strokeStyle='#FFE08A';g.lineWidth=4;
  if(vm>0.06){
    var ux=vx/vm,uy=vy/vm;
    g.beginPath();g.moveTo(cx+ux*rad,cy+uy*rad);g.lineTo(cx+ux*rad*1.32,cy+uy*rad*1.32);g.stroke();
    g.beginPath();g.moveTo(cx-ux*rad,cy-uy*rad);g.lineTo(cx-ux*rad*1.32,cy-uy*rad*1.32);g.stroke();
    g.fillStyle='#FFE08A';g.beginPath();g.arc(cx+ux*rad*1.32,cy+uy*rad*1.32,5,0,TAU);g.fill();
    g.font='800 '+fs+'px '+FONT;g.textAlign='center';g.fillText('北極',cx+ux*rad*1.32,Math.max(fs*0.7,cy+uy*rad*1.32+(uy<0?-fs*0.9:fs*0.9)));
  }
  // 北極喺面向我哋嗰面
  var npD=dot(axis,B.C);
  if(npD>0.05){g.fillStyle='#FFE08A';g.beginPath();g.arc(cx+vx*rad,cy+vy*rad,5,0,TAU);g.fill();}
  // 澳門
  var m=macauWorld(state.eps,state.psi);
  var depth=dot(m,B.C);
  var sinAlt=dot(m,s);
  if(depth>0.03){
    var mx=cx+dot(m,B.R)*rad, my=cy-dot(m,B.U)*rad;
    var pulse=1+0.25*Math.sin((t||0)/260);
    g.fillStyle='rgba(232,97,140,.28)';g.beginPath();g.arc(mx,my,rad*0.1*pulse+6,0,TAU);g.fill();
    g.fillStyle='#E8618C';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(mx,my,Math.max(6,rad*0.055),0,TAU);g.fill();g.stroke();
    g.font='900 '+fs+'px '+FONT;
    var lab='澳門';var tw=g.measureText(lab).width+16;
    var lx=mx+rad*0.1+6; if(lx+tw>W-4) lx=mx-rad*0.1-6-tw;
    rr(g,lx,my-fs*0.75,tw,fs*1.5,10);g.fillStyle='#fff';g.fill();
    g.fillStyle='#E8618C';g.textAlign='left';g.fillText(lab,lx+8,my);
  }
  g.font='700 '+(fs*0.9)+'px '+FONT;g.fillStyle='#cfe0ff';g.textAlign='left';
  g.fillText('↺ 自轉：由西向東',10,H-fs*2.0);
  g.fillText('粉紅線 = 澳門所在緯度',10,H-fs*0.8);
  return {sinAlt:sinAlt};
}

function dragTo(p){
  var G=orbitGeom;
  var yw=(p.x-G.cx)/G.R, xw=(p.y-G.cy)/(G.R*G.sinEl);
  if(Math.abs(yw)+Math.abs(xw)<0.15) return;
  var L=Math.atan2(yw,xw)/D2R;
  setDate(lamToD(L+180),true);
}

  var t=$('qtabs');
  if(t&&!t.children.length){
    QS.forEach(function(_,i){var b=document.createElement('button');b.type='button';b.className='btn toggle';b.textContent='問題 '+(i+1);b.addEventListener('click',function(){qi=i;renderQ();});t.appendChild(b);});
    var sp=document.createElement('div');sp.className='spacer';t.appendChild(sp);
    var tt=document.createElement('div');tt.style.fontWeight='800';tt.textContent='教學提問卡';t.appendChild(tt);
  }
  if(t)for(var i=0;i<t.children.length-2;i++){t.children[i].className='btn toggle'+(i===qi?' on':'');}
  var q=QS[qi];
  setTxt2('qn','問題 '+(qi+1)+' / '+QS.length);setTxt2('qt',q.q);setTxt2('qa',q.a);setTxt2('qGo',q.btn);
  var f=$('flip');if(f)f.className='flip';
}
function setTxt2(id,v){var el=$(id);if(el)el.textContent=v;}
function openQ(){var o=$('ov');if(o)o.className='overlay on';renderQ();}
function closeQ(){var o=$('ov');if(o)o.className='overlay';}
function flipQ(){var f=$('flip');if(f)f.classList.toggle('fl');}
bind('btnQ','click',openQ);
bind('qClose','click',closeQ);
bind('qFlip','click',flipQ);
bind('flip','click',flipQ);
bind('flip','keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flipQ();}});
bind('qGo','click',function(){QS[qi].act();closeQ();});
bind('ov','click',function(e){if(e.target&&e.target.id==='ov')closeQ();});
window.addEventListener('keydown',function(e){if(e.key==='Escape')closeQ();});

/* ---------- 主迴圈 ---------- */
var last=0;
function frame(t){
  var dt=last?Math.min(0.05,(t-last)/1000):0;last=t;
  if(state.playing){
    var dp=dps(state.speedV);
    if(state.orbit){state.d=(state.d+dp*dt)%YEAR;}
    if(state.spin){
      if(dp>2.5)state.psi+=TAU*0.3*dt;else state.psi+=TAU*1.0027379*dp*dt;
      state.psi=state.psi%TAU;
    }
    dirty=true;
  }
  if(Math.abs(state.eps-state.epsT)>0.005){state.eps+=(state.epsT-state.eps)*Math.min(1,dt*6);dirty=true;}
  else if(state.eps!==state.epsT){state.eps=state.epsT;dirty=true;}
  if(dirty){
    dirty=false;
    try{
      resizeAll();
      drawOrbit(t);
      var z=drawZoom(t);
      updateInfo();
      if(z)updateStatus(z.sinAlt);
      if(dateEl&&!dragSlider){var v=String(Math.floor(state.d));if(dateEl.value!==v)dateEl.value=v;}
    }catch(err){/* 保持畫面運作 */}
  }
  window.requestAnimationFrame(frame);
}
// 網址參數（備課測試用，例如 #d=171&pause=1&tilt=0&q=1）
try{
  var hp={};(location.hash||'').replace(/^#/,'').split('&').forEach(function(x){var kv=x.split('=');if(kv[0])hp[kv[0]]=kv[1];});
  if(hp.d!==undefined){state.d=+hp.d;}
  if(hp.psi!==undefined){state.psi=+hp.psi;}
  if(hp.speed!==undefined){state.speedV=+hp.speed;var spEl=$('speed');if(spEl)spEl.value=hp.speed;}
  if(hp.tilt==='0'){state.tilt=false;state.eps=0;state.epsT=0;}
  if(hp.pause==='1'){state.playing=false;}
}catch(e){}
syncBtns();
if(dateEl)dateEl.value=String(Math.floor(state.d));
renderQ();
try{if(/(^|[#&])q=1/.test(location.hash)){openQ();if(/flip=1/.test(location.hash))flipQ();}}catch(e){}
window.requestAnimationFrame(frame);
})();
</script>
